.header{position:absolute;left:32%;top:2.2%;width:36%;height:5.4%;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none}

.hud{position:absolute;top:2.9%;right:2.2%;z-index:8;display:grid;gap:.65vmin;justify-items:end}.hudRow{display:flex;gap:.6vmin}.pill,.smallBtn{border:0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 .45vmin 1.1vmin rgba(16,11,48,.28);color:#123675;font-weight:900;font-size:clamp(10px,1.02vw,17px);padding:.55vmin 1vmin;white-space:nowrap}.smallBtn{cursor:pointer;border:.16vmin solid rgba(22,65,154,.18)}.smallBtn:active{transform:translateY(.1vmin)}
.zone{position:absolute;top:31.1%;width:29.2%;height:28.6%;z-index:4;border-radius:42% 42% 28% 28%;cursor:pointer;outline:none}.zone.sh{left:19.0%}.zone.ch{left:51.1%}.zone::after{content:"";position:absolute;inset:2%;border-radius:inherit;border:.35vmin solid transparent;transition:.18s ease;pointer-events:none}.zone.active::after,.zone.hover::after{border-color:rgba(255,255,255,.96);box-shadow:0 0 0 .35vmin rgba(120,226,255,.22),0 0 3vmin 1.1vmin rgba(104,209,255,.78);background:rgba(255,255,255,.05)}.zone.sh.active::after,.zone.sh.hover::after{box-shadow:0 0 0 .35vmin rgba(239,171,255,.22),0 0 3vmin 1.1vmin rgba(211,111,255,.86)}.zone.correctPulse{animation:zoneBounce .5s ease}.zone.wrongPulse{animation:zoneShake .38s ease}@keyframes zoneBounce{0%,100%{transform:scale(1)}45%{transform:scale(1.035)}70%{transform:scale(.99)}}@keyframes zoneShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6vmin)}50%{transform:translateX(.6vmin)}75%{transform:translateX(-.35vmin)}}

.cards{position:absolute;left:1.35%;right:1.35%;bottom:1.8%;height:34.7%;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.1vmin 1.2vmin;align-items:stretch}.card{position:relative;min-width:0;border-radius:2.3vmin;background:linear-gradient(180deg,#f8d89c,#c98538);padding:.45vmin;box-shadow:0 .55vmin 0 rgba(99,47,9,.5),0 1.2vmin 2.2vmin rgba(44,18,0,.32);cursor:grab;touch-action:none;user-select:none;transform:translate3d(0,0,0);transition:transform .16s ease,filter .16s ease,opacity .28s ease}.cardInner{height:100%;border-radius:1.9vmin;background:linear-gradient(180deg,#fffdf8,#fff7e9);border:.16vmin solid rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;padding:.7vmin 1.1vmin;overflow:hidden}.word{font-weight:900;color:var(--navy);font-size:clamp(24px,3.25vw,58px);line-height:.96;text-align:center;letter-spacing:-.02em;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}.card.long .word{font-size:clamp(21px,2.75vw,49px)}.card:hover{filter:brightness(1.03)}.card.selected{transform:scale(1.045);filter:brightness(1.05);box-shadow:0 .55vmin 0 rgba(99,47,9,.5),0 1.1vmin 2vmin rgba(44,18,0,.35),0 0 0 .4vmin rgba(255,255,255,.8),0 0 2.1vmin rgba(106,208,255,.95)}.card.dragging{z-index:30;cursor:grabbing;transition:none;filter:brightness(1.04);box-shadow:0 2vmin 4vmin rgba(19,11,40,.45),0 0 0 .3vmin rgba(255,255,255,.65);transform:translate3d(var(--dx),var(--dy),0) scale(1.055)}.card.returning{transition:transform .26s cubic-bezier(.22,.82,.31,1.08)}.card.shake{animation:cardShake .36s ease}.card.solved{opacity:0;pointer-events:none;transform:scale(.88)}@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.75vmin)}40%{transform:translateX(.75vmin)}60%{transform:translateX(-.45vmin)}80%{transform:translateX(.35vmin)}}
.feedback{position:absolute;left:50%;top:20.4%;transform:translate(-50%,-50%) scale(.92);z-index:20;opacity:0;pointer-events:none;background:rgba(255,255,255,.96);color:#123579;font-weight:900;font-size:clamp(18px,2.25vw,38px);padding:.55vmin 1.5vmin;border-radius:999px;box-shadow:var(--shadow);transition:.16s ease}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.flyCard{position:absolute;z-index:40;border-radius:2vmin;background:linear-gradient(180deg,#f8d89c,#c98538);padding:.4vmin;box-shadow:0 1.5vmin 3.5vmin rgba(10,5,40,.4);pointer-events:none;transition:left .48s cubic-bezier(.2,.8,.2,1),top .48s cubic-bezier(.2,.8,.2,1),width .48s ease,height .48s ease,opacity .48s ease,transform .48s ease}.flyCard>div{height:100%;border-radius:1.65vmin;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900;font-size:clamp(18px,2.2vw,39px);padding:.5vmin}.rewardStar{position:absolute;z-index:50;width:2.4vmin;height:2.4vmin;background:#ffd95c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 .8vmin #fff5a5);pointer-events:none;transition:left .62s cubic-bezier(.2,.8,.2,1),top .62s cubic-bezier(.2,.8,.2,1),transform .62s ease,opacity .62s ease}
.sparkle{position:absolute;z-index:3;width:1.15vmin;height:1.15vmin;border-radius:50%;background:rgba(255,255,255,.84);box-shadow:0 0 1.5vmin .45vmin rgba(116,210,255,.82);animation:twinkle 2.7s ease-in-out infinite;pointer-events:none}.sparkle.s1{left:47%;top:31%;animation-delay:-.4s}.sparkle.s2{left:82%;top:36%;animation-delay:-1.4s}.sparkle.s3{left:23%;top:47%;animation-delay:-2.1s}.sparkle.s4{left:73%;top:26%;animation-delay:-.9s}@keyframes twinkle{0%,100%{opacity:.28;transform:scale(.65) translateY(0)}50%{opacity:1;transform:scale(1.15) translateY(-.8vmin)}}
#reward{position:absolute;inset:0;z-index:100;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(66,54,150,.28),rgba(15,8,48,.84));backdrop-filter:blur(.45vmin);overflow:hidden}#reward.show{display:grid;animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.rewardPanel{position:relative;width:min(62%,720px);height:min(72%,690px);border-radius:5vmin;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,246,255,.94));border:.28vmin solid rgba(255,255,255,.95);box-shadow:0 2vmin 7vmin rgba(0,0,0,.42),0 0 5vmin rgba(126,117,255,.38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vmin;padding:4vmin;z-index:2}.speech{font-size:clamp(30px,4.5vw,78px);font-weight:900;color:#123579;background:white;border-radius:4vmin;padding:1.2vmin 3vmin;box-shadow:0 1vmin 2vmin rgba(33,23,89,.18)}.petBubble{width:min(45%,270px);aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fffdf7,#dff6ff 65%,#b8dfff);box-shadow:inset 0 0 0 .5vmin rgba(255,255,255,.9),0 0 4vmin rgba(75,190,255,.65);animation:petJump 1.35s ease-in-out infinite;overflow:hidden}.pet{width:86%;height:86%;object-fit:cover;border-radius:34%;mix-blend-mode:multiply;transform-origin:55% 75%;animation:petWave 1.35s ease-in-out infinite}@keyframes petJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-2.4vmin)}60%{transform:translateY(-2.1vmin)}}@keyframes petWave{0%,100%{transform:rotate(-1deg) scale(1)}45%{transform:rotate(4deg) scale(1.035)}70%{transform:rotate(-3deg) scale(1.015)}}.playAgain{border:0;border-radius:999px;background:linear-gradient(180deg,#2f8cf7,#1668d7);color:white;font-size:clamp(20px,2.1vw,36px);font-weight:900;padding:1.1vmin 3.3vmin;box-shadow:0 .7vmin 0 #0c4fae,0 1.6vmin 3vmin rgba(24,61,140,.27);cursor:pointer}.playAgain:active{transform:translateY(.3vmin);box-shadow:0 .35vmin 0 #0c4fae,0 .9vmin 1.5vmin rgba(24,61,140,.22)}.rainStar{position:absolute;top:-6vmin;width:1.7vmin;height:1.7vmin;background:#ffe268;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 .6vmin #fff7bc);animation:rain linear infinite;opacity:.9}@keyframes rain{to{transform:translateY(115vh) rotate(420deg);opacity:.2}}
@media (max-aspect-ratio:1/1){#game{width:100vw;height:75vw}.hud{right:1.2%;top:1.6%}.header{left:30%;width:40%}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

<script>
(()=>{
'use strict';
const pages=[
[['ship','sh'],['shell','sh'],['shop','sh'],['fish','sh'],['chair','ch'],['chick','ch'],['cheese','ch'],['lunch','ch']],
[['sheep','sh'],['shoe','sh'],['shark','sh'],['brush','sh'],['child','ch'],['cherry','ch'],['teacher','ch'],['beach','ch']],
[['shower','sh'],['shelf','sh'],['dish','sh'],['shorts','sh'],['chocolate','ch'],['chicken','ch'],['chips','ch'],['watch','ch']],
[['shape','sh'],['shirt','sh'],['wish','sh'],['English','sh'],['chin','ch'],['bench','ch'],['kitchen','ch'],['much','ch']]
];
const total=pages.reduce((n,p)=>n+p.length,0),cardsEl=document.getElementById('cards'),instruction=document.getElementById('instruction'),taskPill=document.getElementById('taskPill'),starsPill=document.getElementById('starsPill'),soundBtn=document.getElementById('soundBtn'),restartBtn=document.getElementById('restartBtn'),feedback=document.getElementById('feedback'),reward=document.getElementById('reward'),playAgain=document.getElementById('playAgain'),starRain=document.getElementById('starRain'),game=document.getElementById('game'),zones=[...document.querySelectorAll('.zone')];
let page=0,stars=0,solved=0,selected=null,soundOn=true,audioCtx=null,drag=null,transitionTimer=0;const goodWords=['Great!','Well done!','Yes!'];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updateHud(){taskPill.textContent=`Task ${page+1}/4`;starsPill.textContent=`Stars ${stars}/${total}`}
function renderPage(){clearTimeout(transitionTimer);selected=null;solved=0;cardsEl.innerHTML='';instruction.textContent='';updateHud();shuffle(pages[page]).forEach(([word,sound],idx)=>{const card=document.createElement('div');card.className='card'+(word.length>=8?' long':'');card.dataset.sound=sound;card.dataset.word=word;card.dataset.index=idx;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',word);card.innerHTML=`<div class="cardInner"><div class="word">${word}</div></div>`;wireCard(card);cardsEl.appendChild(card)})}
function ensureAudio(){if(!soundOn)return null;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq=660,dur=.1,type='sine',vol=.05,delay=0){const ctx=ensureAudio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+delay;o.start(t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.stop(t+dur+.02)}
function correctSound(){tone(660,.1,'sine',.055);tone(880,.12,'sine',.045,.08);tone(1100,.16,'sine',.035,.16)}function wrongSound(){tone(220,.12,'triangle',.035);tone(165,.16,'triangle',.025,.08)}
function speak(word){if(!soundOn||!('speechSynthesis'in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.84;u.pitch=1.04;const vv=window.speechSynthesis.getVoices();const gb=vv.find(v=>/en[-_ ]GB/i.test(v.lang)||/British/i.test(v.name));if(gb)u.voice=gb;window.speechSynthesis.speak(u)}catch(e){}}
function showFeedback(text,ok=true){feedback.textContent=text;feedback.style.color=ok?'#123579':'#8b3550';feedback.classList.add('show');clearTimeout(showFeedback.t);showFeedback.t=setTimeout(()=>feedback.classList.remove('show'),650)}
function clearSelection(){if(selected)selected.classList.remove('selected');selected=null;zones.forEach(z=>z.classList.remove('active'))}function selectCard(card){if(card.classList.contains('solved'))return;if(selected===card){clearSelection();return}clearSelection();selected=card;card.classList.add('selected');zones.forEach(z=>z.classList.add('active'));speak(card.dataset.word)}
function getZoneAt(x,y){return zones.find(z=>{const r=z.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}
function wireCard(card){card.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;card.setPointerCapture?.(e.pointerId);drag={card,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,dx:0,dy:0,moved:false};card.style.setProperty('--dx','0px');card.style.setProperty('--dy','0px')});card.addEventListener('pointermove',e=>{if(!drag||drag.card!==card||drag.pointerId!==e.pointerId)return;drag.dx=e.clientX-drag.startX;drag.dy=e.clientY-drag.startY;if(Math.hypot(drag.dx,drag.dy)>6)drag.moved=true;if(drag.moved){card.classList.add('dragging');card.style.setProperty('--dx',drag.dx+'px');card.style.setProperty('--dy',drag.dy+'px');zones.forEach(z=>z.classList.toggle('hover',z===getZoneAt(e.clientX,e.clientY)))}});card.addEventListener('pointerup',e=>{if(!drag||drag.card!==card)return;const wasMoved=drag.moved,zone=getZoneAt(e.clientX,e.clientY);card.releasePointerCapture?.(e.pointerId);zones.forEach(z=>z.classList.remove('hover'));if(wasMoved){card.classList.remove('dragging');card.classList.add('returning');card.style.removeProperty('--dx');card.style.removeProperty('--dy');setTimeout(()=>card.classList.remove('returning'),280);if(zone)attempt(card,zone)}else selectCard(card);drag=null});card.addEventListener('pointercancel',()=>{if(drag&&drag.card===card){card.classList.remove('dragging');card.style.removeProperty('--dx');card.style.removeProperty('--dy');zones.forEach(z=>z.classList.remove('hover'));drag=null}});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCard(card)}})}
zones.forEach(z=>{z.addEventListener('click',()=>{if(selected)attempt(selected,z)});z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(selected,z)}})});
function attempt(card,zone){if(!card||card.classList.contains('solved'))return;if(card.dataset.sound===zone.dataset.sound)correct(card,zone);else{wrongSound();showFeedback('Oops!',false);zone.classList.remove('wrongPulse');void zone.offsetWidth;zone.classList.add('wrongPulse');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),400);clearSelection()}}
function correct(card,zone){correctSound();showFeedback(goodWords[Math.floor(Math.random()*goodWords.length)],true);zone.classList.remove('correctPulse');void zone.offsetWidth;zone.classList.add('correctPulse');animateIntoZone(card,zone);card.classList.add('solved');stars++;solved++;updateHud();flyStar(zone);clearSelection();if(solved===pages[page].length){transitionTimer=setTimeout(()=>{if(page<pages.length-1){page++;const a=cardsEl.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});a.onfinish=()=>{renderPage();cardsEl.animate([{opacity:0},{opacity:1}],{duration:260,fill:'forwards'})}}else showReward()},720)}}
function animateIntoZone(card,zone){const gr=game.getBoundingClientRect(),cr=card.getBoundingClientRect(),zr=zone.getBoundingClientRect(),f=document.createElement('div');f.className='flyCard';f.innerHTML=`<div>${card.dataset.word}</div>`;f.style.left=(cr.left-gr.left)+'px';f.style.top=(cr.top-gr.top)+'px';f.style.width=cr.width+'px';f.style.height=cr.height+'px';game.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{const targetW=cr.width*.38,targetH=cr.height*.38;f.style.left=(zr.left-gr.left+zr.width/2-targetW/2)+'px';f.style.top=(zr.top-gr.top+zr.height*.38-targetH/2)+'px';f.style.width=targetW+'px';f.style.height=targetH+'px';f.style.opacity='0';f.style.transform='scale(.55) rotate(-4deg)'}));setTimeout(()=>f.remove(),560)}
function flyStar(zone){const gr=game.getBoundingClientRect(),zr=zone.getBoundingClientRect(),sr=starsPill.getBoundingClientRect(),s=document.createElement('div');s.className='rewardStar';s.style.left=(zr.left-gr.left+zr.width/2)+'px';s.style.top=(zr.top-gr.top+zr.height*.3)+'px';game.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.left=(sr.left-gr.left+sr.width*.45)+'px';s.style.top=(sr.top-gr.top+sr.height*.35)+'px';s.style.transform='scale(.45) rotate(360deg)';s.style.opacity='.35'}));setTimeout(()=>s.remove(),720)}
function showReward(){instruction.textContent='';reward.classList.add('show');buildRain();correctSound();setTimeout(correctSound,260)}function buildRain(){starRain.innerHTML='';for(let i=0;i<28;i++){const s=document.createElement('i');s.className='rainStar';s.style.left=(2+Math.random()*96)+'%';s.style.animationDuration=(2.8+Math.random()*3.2)+'s';s.style.animationDelay=(-Math.random()*4)+'s';s.style.transform=`scale(${.6+Math.random()*.8})`;starRain.appendChild(s)}}
function resetGame(){window.speechSynthesis?.cancel?.();page=0;stars=0;solved=0;clearSelection();reward.classList.remove('show');renderPage();showFeedback('Ready!',true)}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'On':'Off');if(soundOn)tone(720,.08,'sine',.04);else window.speechSynthesis?.cancel?.()});restartBtn.addEventListener('click',resetGame);playAgain.addEventListener('click',resetGame);window.addEventListener('blur',()=>{if(drag){drag.card.classList.remove('dragging');drag.card.style.removeProperty('--dx');drag.card.style.removeProperty('--dy');drag=null;zones.forEach(z=>z.classList.remove('hover'))}});renderPage();
})();
</script>
</body></html>
