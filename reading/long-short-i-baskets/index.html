  /* faint moving atmospheric glints */
  .glints{position:absolute;inset:0;pointer-events:none;z-index:2}
  .glint{
    position:absolute;width:calc(10px * var(--s));aspect-ratio:1;
    filter:drop-shadow(0 0 calc(8px * var(--s)) rgba(255,235,139,.95));
    animation:twinkle 2.4s ease-in-out infinite;
  }
  .glint::before,.glint::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:linear-gradient(#fff7bb,#ffd75a);
    border-radius:999px;
  }
  .glint::before{width:100%;height:22%}
  .glint::after{width:22%;height:100%}
  @keyframes twinkle{0%,100%{opacity:.18;transform:scale(.65) rotate(0)}50%{opacity:.95;transform:scale(1.1) rotate(45deg)}}

  /* compact HUD; positioned only over free sky */
  #hudLeft{
    position:absolute;left:1.5%;top:1.35%;z-index:20;
    width:calc(220px * var(--s));
    border-radius:calc(24px * var(--s));
    padding:calc(9px * var(--s)) calc(14px * var(--s)) calc(10px * var(--s));
    background:linear-gradient(180deg,rgba(111,70,205,.96),rgba(73,47,154,.95));
    border:calc(2px * var(--s)) solid rgba(255,255,255,.85);
    box-shadow:0 calc(5px * var(--s)) calc(14px * var(--s)) rgba(39,22,104,.25), inset 0 1px 0 rgba(255,255,255,.45);
    color:white;
  }
  #gameName{
    font-size:calc(18px * var(--s));font-weight:900;letter-spacing:.01em;
    line-height:1.05;white-space:nowrap;
  }
  #taskText{margin-top:calc(5px * var(--s));font-size:calc(15px * var(--s));font-weight:900;opacity:.98}
  #progressTrack{
    height:calc(8px * var(--s));margin-top:calc(7px * var(--s));
    border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;
    box-shadow:inset 0 1px calc(3px * var(--s)) rgba(37,17,93,.3)
  }
  #progressFill{height:100%;width:0;background:linear-gradient(90deg,#fff3a4,#ffc83f);border-radius:999px;transition:width .45s ease}

  #hudRight{
    position:absolute;right:1.5%;top:1.35%;z-index:20;
    display:flex;align-items:center;gap:calc(8px * var(--s));
  }
  #starCounter{
    min-width:calc(115px * var(--s));height:calc(48px * var(--s));
    padding:0 calc(13px * var(--s));
    display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--s));
    color:white;font-weight:900;font-size:calc(20px * var(--s));
    border-radius:calc(22px * var(--s));
    background:linear-gradient(180deg,rgba(87,67,192,.96),rgba(58,39,142,.95));
    border:calc(2px * var(--s)) solid rgba(255,255,255,.9);
    box-shadow:0 calc(5px * var(--s)) calc(13px * var(--s)) rgba(35,19,95,.25),inset 0 1px 0 rgba(255,255,255,.45);
  }
  .miniStar{
    width:calc(26px * var(--s));height:calc(26px * var(--s));
    clip-path:polygon(50% 0,61% 34%,97% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,3% 35%,39% 34%);
    background:linear-gradient(145deg,#fff19a 0%,#ffc338 48%,#f59a17 100%);
    filter:drop-shadow(0 calc(2px * var(--s)) calc(2px * var(--s)) rgba(116,64,0,.34));
  }
  .hudBtn{
    height:calc(48px * var(--s));min-width:calc(76px * var(--s));
    padding:0 calc(14px * var(--s));border:none;cursor:pointer;
    border-radius:calc(22px * var(--s));
    background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(232,235,255,.96));
    color:var(--navy);font:900 calc(15px * var(--s)) "Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    border:calc(2px * var(--s)) solid rgba(82,60,169,.62);
    box-shadow:0 calc(5px * var(--s)) calc(12px * var(--s)) rgba(46,38,114,.22),inset 0 1px 0 white;
  }
  .hudBtn:active{transform:translateY(calc(1px * var(--s))) scale(.98)}

  /* Only on rounds 2–4: cover the reference instruction bubble with a decorative cloud, no repeated instruction text. */
  #instructionCover{
    position:absolute;left:33.2%;top:.7%;width:31.5%;height:18%;z-index:8;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
    border-radius:46% 48% 42% 48% / 58% 58% 42% 44%;
    background:
      radial-gradient(ellipse at 22% 62%,#fff 0 31%,transparent 32%),
      radial-gradient(ellipse at 40% 37%,#fff 0 36%,transparent 37%),
      radial-gradient(ellipse at 63% 38%,#fff 0 35%,transparent 36%),
      radial-gradient(ellipse at 79% 64%,#fff 0 31%,transparent 32%),
      linear-gradient(180deg,#fff,#eef3ff);
    filter:drop-shadow(0 calc(7px * var(--s)) calc(8px * var(--s)) rgba(57,63,140,.16));
  }
  #instructionCover.show{opacity:1}

  /* Invisible semantic/clickable sorting zones aligned with the 3D baskets in the reference. */
  .zone{
    position:absolute;top:28%;height:28%;z-index:11;
    border:0;background:transparent;appearance:none;-webkit-appearance:none;padding:0;
    border-radius:40% 40% 30% 30% / 28% 28% 40% 40%;
    cursor:pointer;outline:none;
    transition:filter .18s ease,box-shadow .18s ease,transform .18s ease;
  }
  #longZone{left:5.1%;width:34.5%}
  #shortZone{right:5.0%;width:34.5%}
  .zone.active,.zone.dragover{
    box-shadow:0 0 0 calc(6px * var(--s)) rgba(255,237,119,.72),0 0 calc(28px * var(--s)) calc(10px * var(--s)) rgba(255,225,79,.5);
    filter:brightness(1.08) saturate(1.08);
    transform:scale(1.015);
  }
  .zone.good{
    animation:zoneBounce .5s ease;
    box-shadow:0 0 0 calc(7px * var(--s)) rgba(255,240,123,.9),0 0 calc(34px * var(--s)) calc(12px * var(--s)) rgba(255,211,70,.66);
  }
  .zone.bad{animation:zoneShake .34s ease}
  @keyframes zoneBounce{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}70%{transform:scale(.99)}}
  @keyframes zoneShake{0%,100%{transform:translateX(0)}25%{transform:translateX(calc(-8px * var(--s)))}75%{transform:translateX(calc(8px * var(--s)))}}

  /* Opaque clean shelf covers the original example cards completely, preventing a double-background look. */
  #shelf{
    position:absolute;left:0;right:0;bottom:0;height:39.2%;z-index:9;
    background:
      radial-gradient(ellipse at 14% 115%,rgba(255,255,255,.9) 0 28%,transparent 29%),
      radial-gradient(ellipse at 83% 112%,rgba(255,255,255,.87) 0 31%,transparent 32%),
      linear-gradient(180deg,rgba(239,235,255,.965) 0%,rgba(232,224,251,.985) 34%,rgba(213,213,248,.995) 100%);
    border-top:calc(2px * var(--s)) solid rgba(255,255,255,.9);
    box-shadow:0 calc(-9px * var(--s)) calc(24px * var(--s)) rgba(115,100,188,.15),inset 0 calc(10px * var(--s)) calc(20px * var(--s)) rgba(255,255,255,.38);
  }
  #cardGrid{
    position:absolute;left:5.5%;right:5.5%;top:64.1%;bottom:4.3%;z-index:15;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
    column-gap:1.55%;row-gap:5.3%;
  }
  .card{
    --dx:0px;--dy:0px;
    position:relative;min-width:0;min-height:0;
    display:grid;place-items:center;
    padding:calc(6px * var(--s)) calc(10px * var(--s));
    border-radius:calc(24px * var(--s));
    border:calc(4px * var(--s)) solid #e5af43;
    background:linear-gradient(145deg,#fffefa 0%,#fff7f0 54%,#f3eced 100%);
    box-shadow:
      0 calc(8px * var(--s)) calc(12px * var(--s)) rgba(65,47,110,.25),
      inset 0 0 0 calc(3px * var(--s)) rgba(255,255,255,.95),
      inset 0 calc(-5px * var(--s)) calc(8px * var(--s)) rgba(193,158,146,.08);
    color:var(--navy);
    font-size:calc(61px * var(--s));
    line-height:.98;font-weight:900;letter-spacing:-.02em;
    text-align:center;
    cursor:grab;
    transform:translate(var(--dx),var(--dy)) scale(1);
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,opacity .28s ease;
    will-change:transform;
    touch-action:none;
    overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;left:8%;right:8%;top:6%;height:20%;
    border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none;
  }
  .card.selected{
    transform:translate(var(--dx),var(--dy)) scale(1.045);
    box-shadow:0 calc(10px * var(--s)) calc(20px * var(--s)) rgba(45,32,110,.32),0 0 0 calc(6px * var(--s)) rgba(255,221,70,.72),inset 0 0 0 calc(3px * var(--s)) white;
    z-index:40;
  }
  .card.dragging{
    cursor:grabbing;z-index:60;transition:none;
    transform:translate(var(--dx),var(--dy)) scale(1.055);
    box-shadow:0 calc(20px * var(--s)) calc(28px * var(--s)) rgba(40,31,97,.36),0 0 0 calc(4px * var(--s)) rgba(255,242,174,.75),inset 0 0 0 calc(3px * var(--s)) white;
  }
  .card.returning{transition:transform .36s cubic-bezier(.22,.8,.2,1),box-shadow .2s ease}
  .card.solved{pointer-events:none}
  .card.shake{animation:cardShake .34s ease}
  @keyframes cardShake{0%,100%{transform:translate(var(--dx),var(--dy))}25%{transform:translate(calc(var(--dx) - 10px * var(--s)),var(--dy))}75%{transform:translate(calc(var(--dx) + 10px * var(--s)),var(--dy))}}

  #feedback{
    position:absolute;left:50%;top:58.6%;z-index:70;
    transform:translate(-50%,-50%) scale(.75);
    min-width:calc(115px * var(--s));
    padding:calc(9px * var(--s)) calc(18px * var(--s));
    border-radius:calc(24px * var(--s));
    background:rgba(255,255,255,.97);
    border:calc(3px * var(--s)) solid rgba(232,181,72,.9);
    box-shadow:0 calc(8px * var(--s)) calc(18px * var(--s)) rgba(53,45,116,.24);
    text-align:center;font-size:calc(27px * var(--s));font-weight:900;
    opacity:0;pointer-events:none;transition:opacity .16s ease,transform .22s cubic-bezier(.2,.85,.3,1.3);
  }
  #feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #feedback.bad{color:#cf3a60;border-color:#f08ca7}
  #feedback.good{color:#287c53;border-color:#72d4a5}

  .flyingStar{
    position:absolute;width:calc(30px * var(--s));height:calc(30px * var(--s));z-index:100;pointer-events:none;
    clip-path:polygon(50% 0,61% 34%,97% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,3% 35%,39% 34%);
    background:linear-gradient(145deg,#fff7aa,#ffc93b 55%,#f29a11);
    filter:drop-shadow(0 0 calc(8px * var(--s)) rgba(255,221,77,.95));
  }

  #reward{
    position:absolute;inset:0;z-index:200;display:none;overflow:hidden;
    background:#c9c7ff;
  }
  #reward.show{display:block}

  #starRain{position:absolute;inset:0;z-index:220;pointer-events:none;overflow:hidden}

    position:absolute;top:-8%;width:calc(16px * var(--s));height:calc(16px * var(--s));
    clip-path:polygon(50% 0,61% 34%,97% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,3% 35%,39% 34%);

    #game{width:100vw;max-height:100vh;border-radius:0}
    .hudBtn{min-width:calc(67px * var(--s));padding:0 calc(10px * var(--s))}

<body>
<main id="game" aria-label="Long I and Short I word sorting game">
  <div class="glints" id="glints" aria-hidden="true"></div>

  <section id="hudLeft" aria-label="Game progress">
    <div id="gameName">LONG &amp; SHORT I</div>
    <div id="taskText">Task 1/4</div>
    <div id="progressTrack"><div id="progressFill"></div></div>
  </section>

  <section id="hudRight">
    <div id="starCounter" aria-live="polite"><span class="miniStar"></span><span id="starText">0/32</span></div>
    <button class="hudBtn" id="soundBtn" type="button" aria-pressed="false">Sound on</button>
    <button class="hudBtn" id="restartBtn" type="button">Restart</button>
  </section>

  <div id="instructionCover" aria-hidden="true"></div>

  <button class="zone" id="longZone" type="button" aria-label="Long I basket"></button>
  <button class="zone" id="shortZone" type="button" aria-label="Short I basket"></button>

  <div id="shelf" aria-hidden="true"></div>
  <div id="cardGrid" aria-label="Word cards"></div>
  <div id="feedback" role="status" aria-live="polite"></div>

  <section id="reward" aria-label="Game complete">
    <div id="rewardArt"></div>
    <div id="pawGlow" aria-hidden="true"></div>
    <div id="starRain" aria-hidden="true"></div>
    <button id="playAgain" type="button">Play again</button>
  </section>
</main>

<script>
(() => {
  "use strict";

  const rounds = [
    [
      {word:"kite", kind:"long"}, {word:"line", kind:"long"}, {word:"bike", kind:"long"}, {word:"smile", kind:"long"},
      {word:"pig", kind:"short"}, {word:"sit", kind:"short"}, {word:"fish", kind:"short"}, {word:"milk", kind:"short"}
    ],
    [
      {word:"five", kind:"long"}, {word:"nine", kind:"long"}, {word:"rice", kind:"long"}, {word:"ice", kind:"long"},
      {word:"ship", kind:"short"}, {word:"lip", kind:"short"}, {word:"win", kind:"short"}, {word:"king", kind:"short"}
    ],
    [
      {word:"time", kind:"long"}, {word:"ride", kind:"long"}, {word:"like", kind:"long"}, {word:"white", kind:"long"},
      {word:"six", kind:"short"}, {word:"hill", kind:"short"}, {word:"ring", kind:"short"}, {word:"swim", kind:"short"}
    ],
    [
      {word:"mice", kind:"long"}, {word:"hide", kind:"long"}, {word:"side", kind:"long"}, {word:"fine", kind:"long"},
      {word:"big", kind:"short"}, {word:"thin", kind:"short"}, {word:"pink", kind:"short"}, {word:"skip", kind:"short"}
    ]
  ];

  const total = rounds.reduce((n,r)=>n+r.length,0);
  const game = document.getElementById("game");
  const grid = document.getElementById("cardGrid");
  const longZone = document.getElementById("longZone");
  const shortZone = document.getElementById("shortZone");
  const zones = {long:longZone, short:shortZone};
  const taskText = document.getElementById("taskText");
  const starText = document.getElementById("starText");
  const progressFill = document.getElementById("progressFill");
  const soundBtn = document.getElementById("soundBtn");
  const restartBtn = document.getElementById("restartBtn");
  const feedback = document.getElementById("feedback");
  const reward = document.getElementById("reward");
  const playAgain = document.getElementById("playAgain");
  const instructionCover = document.getElementById("instructionCover");
  const starRain = document.getElementById("starRain");

  let roundIndex = 0;
  let stars = 0;
  let solvedThisRound = 0;
  let selectedCard = null;
  let drag = null;
  let soundOn = true;
  let audioCtx = null;
  let feedbackTimer = null;
  let transitionTimer = null;

  function scaleGame(){
    const r = game.getBoundingClientRect();
    game.style.setProperty("--s", Math.max(.36, r.width / 1448));
  }
  window.addEventListener("resize", scaleGame, {passive:true});
  scaleGame();

  function shuffle(items){
    const a = items.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function initGlints(){
    const holder = document.getElementById("glints");
    holder.innerHTML="";
    const spots = [
      [7,11,0],[15,17,.8],[42,8,1.3],[67,10,.4],[85,7,1.8],[93,16,.7],
      [32,49,1.2],[59,53,.2],[79,50,1.5],[49,23,.9]
    ];
    spots.forEach(([x,y,d])=>{
      const el=document.createElement("i");
      el.className="glint";
      el.style.left=x+"%";el.style.top=y+"%";el.style.animationDelay=d+"s";
      holder.appendChild(el);
    });
  }

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }

  function tone(freq,duration,type="sine",gain=.055,delay=0){
    if(!soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(gain,now+.018);
    g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g).connect(audioCtx.destination);
    o.start(now);o.stop(now+duration+.03);
  }

  function soundCorrect(){
    tone(660,.13,"sine",.05);
    tone(880,.16,"sine",.05,.09);
    tone(1100,.18,"triangle",.038,.19);
  }
  function soundWrong(){
    tone(230,.14,"sine",.045);
    tone(180,.18,"sine",.036,.11);
  }
  function soundFinish(){
    [523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.045,i*.11));
  }

  function updateHud(){
    taskText.textContent = `Task ${roundIndex+1}/4`;
    starText.textContent = `${stars}/${total}`;
    progressFill.style.width = `${(stars/total)*100}%`;
    game.classList.toggle("noInstruction", roundIndex>0);
    instructionCover.classList.remove("show");
  }

  function fitWord(card,word){
    const len=word.length;
    let base = len<=4 ? 64 : len===5 ? 58 : 52;
    card.style.fontSize = `calc(${base}px * var(--s))`;
  }

  function makeCard(item,index){
    const c=document.createElement("button");
    c.type="button";
    c.className="card";
    c.textContent=item.word;
    c.dataset.kind=item.kind;
    c.dataset.word=item.word;
    c.dataset.index=index;
    c.setAttribute("aria-label", `${item.word}, word card`);
    fitWord(c,item.word);

    c.addEventListener("pointerdown", onCardPointerDown);
    return c;
  }

  function startRound(index){
    clearTimeout(transitionTimer);
    roundIndex=index;
    solvedThisRound=0;
    clearSelection();
    grid.innerHTML="";
    shuffle(rounds[index]).forEach((item,i)=>grid.appendChild(makeCard(item,i)));
    reward.classList.remove("show");
    updateHud();
  }

  function clearSelection(){
    if(selectedCard) selectedCard.classList.remove("selected");
    selectedCard=null;
    longZone.classList.remove("active","dragover");
    shortZone.classList.remove("active","dragover");
  }

  function selectCard(card){
    if(card.classList.contains("solved")) return;
    if(selectedCard===card){
      clearSelection();
      return;
    }
    clearSelection();
    selectedCard=card;
    card.classList.add("selected");
    longZone.classList.add("active");
    shortZone.classList.add("active");
  }

  function pointInside(rect,x,y){
    return x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom;
  }

  function zoneAtPoint(x,y){
    for(const [kind,z] of Object.entries(zones)){
      const r=z.getBoundingClientRect();
      if(pointInside(r,x,y)) return {kind,zone:z};
    }
    return null;
  }

  function setCardOffset(card,x,y){
    card.style.setProperty("--dx", x+"px");
    card.style.setProperty("--dy", y+"px");
  }

  function onCardPointerDown(e){
    if(e.button!==undefined && e.button!==0) return;
    const card=e.currentTarget;
    if(card.classList.contains("solved")) return;
    ensureAudio();
    drag={
      card,pointerId:e.pointerId,
      startX:e.clientX,startY:e.clientY,
      dx:0,dy:0,moved:false,active:true
    };
    card.setPointerCapture?.(e.pointerId);
    card.classList.add("dragging");
    e.preventDefault();
  }

  function onCardPointerMove(e){
    if(!drag || !drag.active || drag.pointerId!==e.pointerId) return;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    drag.dx=dx;drag.dy=dy;
    if(Math.hypot(dx,dy)>7) drag.moved=true;
    setCardOffset(drag.card,dx,dy);
    const hit=zoneAtPoint(e.clientX,e.clientY);
    longZone.classList.toggle("dragover", !!hit && hit.kind==="long");
    shortZone.classList.toggle("dragover", !!hit && hit.kind==="short");
    e.preventDefault();
  }

  function onCardPointerUp(e){
    if(!drag || !drag.active || drag.pointerId!==e.pointerId) return;
    const card=drag.card;
    const moved=drag.moved;
    const hit=zoneAtPoint(e.clientX,e.clientY);
    drag.active=false;
    try{card.releasePointerCapture?.(e.pointerId)}catch(_){}
    card.classList.remove("dragging");
    longZone.classList.remove("dragover");
    shortZone.classList.remove("dragover");

    if(moved){
      if(hit) attempt(card,hit.kind,hit.zone,true);
      else returnCard(card);
    } else {
      setCardOffset(card,0,0);
      selectCard(card);
    }
    drag=null;
    e.preventDefault();
    e.stopPropagation();
  }

  function onCardPointerCancel(e){
    if(drag && drag.pointerId===e.pointerId){
      cancelDrag(true);
    }
  }

  function cancelDrag(returnHome){
    if(!drag) return;
    drag.active=false;
    drag.card.classList.remove("dragging");
    longZone.classList.remove("dragover");
    shortZone.classList.remove("dragover");
    if(returnHome) returnCard(drag.card);
    drag=null;
  }

  function returnCard(card){
    card.classList.add("returning");
    setCardOffset(card,0,0);
    setTimeout(()=>card.classList.remove("returning"),380);
  }

  function showFeedback(text,good){
    clearTimeout(feedbackTimer);
    feedback.textContent=text;
    feedback.className=good ? "show good" : "show bad";
    feedbackTimer=setTimeout(()=>feedback.className="",680);
  }

  function flyStar(fromZone){
    const s=document.createElement("i");
    s.className="flyingStar";
    game.appendChild(s);
    const gr=game.getBoundingClientRect();
    const fr=fromZone.getBoundingClientRect();
    const tr=document.getElementById("starCounter").getBoundingClientRect();
    const sx=fr.left+fr.width/2-gr.left, sy=fr.top+fr.height/2-gr.top;
    const tx=tr.left+tr.width*.28-gr.left, ty=tr.top+tr.height/2-gr.top;
    s.style.left=(sx-15*parseFloat(getComputedStyle(game).getPropertyValue("--s")))+"px";
    s.style.top=(sy-15*parseFloat(getComputedStyle(game).getPropertyValue("--s")))+"px";
    const anim=s.animate([
      {transform:"translate(0,0) scale(.65) rotate(0deg)",opacity:0},
      {transform:"translate(0,-18px) scale(1.25) rotate(80deg)",opacity:1,offset:.25},
      {transform:`translate(${tx-sx}px,${ty-sy}px) scale(.55) rotate(360deg)`,opacity:1}
    ],{duration:620,easing:"cubic-bezier(.2,.75,.25,1)"});
    anim.onfinish=()=>s.remove();
  }

  function attempt(card,kind,zone,fromDrag=false){
    if(!card || card.classList.contains("solved")) return;
    ensureAudio();
    const correct=card.dataset.kind===kind;

    if(correct){
      clearSelection();
      zone.classList.add("good");
      setTimeout(()=>zone.classList.remove("good"),520);
      showFeedback(["Great!","Well done!","Yes!"][Math.floor(Math.random()*3)],true);
      soundCorrect();

      const cardRect=card.getBoundingClientRect();
      const zoneRect=zone.getBoundingClientRect();
      const cx=cardRect.left+cardRect.width/2;
      const cy=cardRect.top+cardRect.height/2;
      const zx=zoneRect.left+zoneRect.width/2;
      const zy=zoneRect.top+zoneRect.height*.58;
      const currentDx=parseFloat(getComputedStyle(card).getPropertyValue("--dx"))||0;
      const currentDy=parseFloat(getComputedStyle(card).getPropertyValue("--dy"))||0;

      card.classList.remove("dragging","returning","selected");
      card.classList.add("solved");
      card.style.transition="transform .52s cubic-bezier(.18,.78,.2,1), opacity .5s ease, filter .35s ease";
      setCardOffset(card,currentDx+(zx-cx),currentDy+(zy-cy));
      card.style.transform=`translate(var(--dx),var(--dy)) scale(.55) rotate(${kind==="long" ? -4 : 4}deg)`;
      card.style.opacity="0";
      card.style.filter="brightness(1.2)";

      flyStar(zone);
      stars++;
      solvedThisRound++;
      updateHud();

      setTimeout(()=>{
        card.style.visibility="hidden";
      },540);

      if(solvedThisRound===rounds[roundIndex].length){
        transitionTimer=setTimeout(()=>{
          if(roundIndex<rounds.length-1) startRound(roundIndex+1);
          else finishGame();
        },850);
      }
    }else{
      soundWrong();
      showFeedback("Oops!",false);
      zone.classList.add("bad");
      card.classList.add("shake");
      setTimeout(()=>{zone.classList.remove("bad");card.classList.remove("shake")},360);
      clearSelection();
      returnCard(card);
    }
  }

  document.addEventListener("pointermove", onCardPointerMove, {passive:false});
  document.addEventListener("pointerup", onCardPointerUp, {passive:false});
  document.addEventListener("pointercancel", onCardPointerCancel, {passive:false});

  [longZone,shortZone].forEach(zone=>{
    zone.addEventListener("click",()=>{
      ensureAudio();
      if(!selectedCard) return;
      attempt(selectedCard, zone===longZone ? "long" : "short", zone, false);
    });
  });

  function makeStarRain(){
    starRain.innerHTML="";
    for(let i=0;i<30;i++){
      const s=document.createElement("i");
      s.className="rainStar";
      s.style.left=(Math.random()*100)+"%";
      s.style.animationDuration=(3.2+Math.random()*3.4)+"s";
      s.style.animationDelay=(-Math.random()*5)+"s";
      const sc=.65+Math.random()*1.25;
      s.style.transform=`scale(${sc})`;
      starRain.appendChild(s);
    }
  }

  function finishGame(){
    clearSelection();
    updateHud();
    makeStarRain();
    reward.classList.add("show");
    soundFinish();
  }

  function resetGame(){
    clearTimeout(transitionTimer);
    clearTimeout(feedbackTimer);
    stars=0;
    roundIndex=0;
    reward.classList.remove("show");
    startRound(0);
  }

  soundBtn.addEventListener("click",()=>{
    soundOn=!soundOn;
    soundBtn.textContent=soundOn ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", String(!soundOn));
    if(soundOn){ensureAudio();tone(760,.11,"sine",.035)}
  });

  restartBtn.addEventListener("click",resetGame);
  playAgain.addEventListener("click",resetGame);

  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"){ clearSelection(); if(drag) cancelDrag(true); }
    if((e.key==="Enter"||e.key===" ") && document.activeElement?.classList.contains("card")){
      e.preventDefault();selectCard(document.activeElement);
    }
  });

  initGlints();
  resetGame();

  // Expose a tiny test hook used only for automated regression checks.
  window.__gameTest = {
    state:()=>({roundIndex,stars,solvedThisRound,total}),
    reset:resetGame,
    solveSelected:(word,kind)=>{
      const card=[...grid.querySelectorAll(".card")].find(c=>c.dataset.word===word);
      if(card) attempt(card,kind,zones[kind],false);
    }
  };
})();
</script>
</body>
</html>
