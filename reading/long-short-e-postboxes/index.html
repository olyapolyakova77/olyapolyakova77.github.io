<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Long & Short E Sorter</title>
<style>
  :root{
    --navy:#06275F;
    --blue:#1187ec;
    --sky:#29b9ff;
    --cream:#fffdf6;
    --card:#fffdf8;
    --cardEdge:#2d8ef0;
    --purple:#8a42d8;
    --green:#2cc77f;
    --danger:#e65a79;
    --shadow:0 10px 24px rgba(7,54,110,.18);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,.95), transparent 30%),
      linear-gradient(180deg,#6fd2ff 0%,#d6f5ff 48%,#f4f0de 100%);
    color:var(--navy);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  button{font:inherit}
  .app{
    height:100vh;
    width:min(100vw,1500px);
    margin:auto;
    display:grid;
    grid-template-rows:auto auto auto;
    gap:10px;
    padding:10px 14px 12px;
    position:relative;
    align-content:start;
  }

  /* ---------- top bar ---------- */
  .topbar{
    min-height:70px;
    display:grid;
    grid-template-columns:minmax(220px,1.1fr) minmax(260px,1.5fr) auto;
    gap:14px;
    align-items:center;
    padding:10px 14px;
    border-radius:24px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.98);
    box-shadow:0 9px 22px rgba(15,75,126,.16), inset 0 -2px 0 rgba(9,75,139,.06);
    backdrop-filter:blur(10px);
  }
  .brand{
    display:flex;align-items:center;gap:12px;min-width:0;
  }
  .brand-dot{
    width:45px;height:45px;border-radius:50%;
    background:radial-gradient(circle at 35% 28%,#fff 0 7%,#63d8ff 8% 24%,#098bf0 50%,#0751ad 100%);
    box-shadow:inset 0 2px 8px rgba(255,255,255,.9),0 4px 10px rgba(1,70,140,.22);
    flex:0 0 auto;
  }
  .brand-title{
    font-size:clamp(19px,2.0vw,30px);
    line-height:1;
    font-weight:900;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .progress-wrap{min-width:0}
  .progress-row{
    display:flex;justify-content:space-between;gap:10px;align-items:center;
    font-size:clamp(14px,1.4vw,18px);
    font-weight:900;margin-bottom:6px;
  }
  .progress-track{
    height:14px;border-radius:999px;background:#dbeeff;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,55,110,.13);
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#4bd49a,#38cdd5,#2a9cf4);
    border-radius:inherit;
    transition:width .45s cubic-bezier(.2,.8,.2,1);
  }
  .controls{display:flex;align-items:center;gap:9px}
  .stars{
    height:45px;padding:0 14px;border-radius:16px;
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#fff9dd,#fff0a9);
    border:2px solid #f4c94f;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 4px 10px rgba(131,99,0,.13);
    font-weight:900;font-size:18px;white-space:nowrap;
  }
  .star-glyph{
    display:inline-block;font-size:27px;line-height:1;color:#ffbd18;
    text-shadow:0 2px 0 #e59c00,0 0 9px rgba(255,205,25,.45);
    animation:twinkle 2.8s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.13) rotate(4deg)}}
  .icon-btn{
    width:45px;height:45px;border-radius:15px;border:0;cursor:pointer;
    background:linear-gradient(180deg,#f7fbff,#e8f4ff);
    color:var(--navy);font-size:21px;font-weight:900;
    box-shadow:inset 0 0 0 2px #cfe6fb,0 4px 9px rgba(18,72,127,.12);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .icon-btn:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 2px #a9d4fa,0 6px 12px rgba(18,72,127,.16)}
  .icon-btn:active{transform:translateY(1px) scale(.97)}

  /* ---------- scene ---------- */
  .scene{
    position:relative;
    height:min(36.5vw,520px);
    min-height:230px;
    overflow:hidden;
    border-radius:28px;
    background:#9fe3ff;
    box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.9);
    isolation:isolate;
  }
  .scene-image{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center 46%;
    transform:scale(1.018);
    animation:sceneBreath 9s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes sceneBreath{
    from{transform:scale(1.018) translate3d(-2px,0,0)}
    to{transform:scale(1.028) translate3d(2px,-1px,0)}
  }
  .scene-shade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 55%,rgba(4,37,81,.05));
  }
  .mote{
    position:absolute;width:8px;height:8px;border-radius:50%;
    background:rgba(255,244,166,.82);
    box-shadow:0 0 11px rgba(255,228,103,.65);
    filter:blur(.1px);pointer-events:none;
    animation:floatMote 7s linear infinite;
  }
  .mote.m2{left:23%;top:64%;animation-delay:-3s;animation-duration:8.4s}
  .mote.m3{left:73%;top:55%;animation-delay:-5s;animation-duration:9.2s}
  .mote.m4{left:88%;top:72%;animation-delay:-1.5s;animation-duration:7.8s}
  .mote.m1{left:8%;top:70%}
  @keyframes floatMote{
    0%{transform:translateY(22px) scale(.7);opacity:0}
    20%{opacity:.8}
    80%{opacity:.65}
    100%{transform:translateY(-90px) translateX(24px) scale(1.05);opacity:0}
  }

  /* broad invisible drop targets precisely over the postboxes */
  .drop-zone{
    position:absolute;
    top:4%;
    padding:0;
    border:0;
    background:transparent;
    appearance:none;
    -webkit-appearance:none;
    height:91%;
    width:36%;
    border-radius:24% 24% 18% 18%;
    cursor:pointer;
    transition:filter .18s ease, box-shadow .18s ease, transform .18s ease;
    z-index:2;
    outline:none;
  }
  .drop-zone.long{left:13.2%}
  .drop-zone.short{right:13.2%}
  .drop-zone::after{
    content:"";
    position:absolute;inset:1.5%;
    border-radius:inherit;
    border:4px solid transparent;
    opacity:0;
    transition:opacity .18s ease,border-color .18s ease,box-shadow .18s ease;
    pointer-events:none;
  }
  .drop-zone.active::after,
  .drop-zone.hovered::after{
    opacity:1;border-color:rgba(255,255,255,.88);
    box-shadow:0 0 0 4px rgba(64,215,255,.58),0 0 28px rgba(255,255,255,.72) inset,0 0 24px rgba(50,211,255,.8);
  }
  .drop-zone.correct::after{
    opacity:1;border-color:#fffbd3;
    box-shadow:0 0 0 5px rgba(255,219,61,.78),0 0 34px rgba(255,239,101,.98);
    animation:zoneBounce .42s ease;
  }
  .drop-zone.wrong::after{
    opacity:1;border-color:#ffd6df;
    box-shadow:0 0 0 5px rgba(236,88,124,.6),0 0 28px rgba(255,160,181,.75);
    animation:zoneShake .38s ease;
  }
  @keyframes zoneBounce{0%{transform:scale(.985)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
  @keyframes zoneShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

  .feedback{
    position:absolute;left:50%;top:5%;
    transform:translate(-50%,-12px) scale(.95);
    z-index:8;
    pointer-events:none;
    min-width:120px;text-align:center;
    padding:9px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.96);
    box-shadow:0 7px 20px rgba(0,42,94,.22);
    font-weight:900;font-size:clamp(18px,2vw,26px);
    opacity:0;
    transition:opacity .18s ease,transform .18s ease;
  }
  .feedback.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .feedback.good{color:#178c62}
  .feedback.bad{color:#bd4662}

  /* ---------- word tray ---------- */
  .tray{
    position:relative;
    padding:10px 10px 4px;
    border-radius:24px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 7px 18px rgba(9,64,119,.09) inset;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px 12px;
  }
  .word-card{
    position:relative;
    min-width:0;
    height:clamp(78px,9.5vh,112px);
    border-radius:22px;
    background:linear-gradient(180deg,#248df0 0%,#0d67c7 100%);
    border:0;
    padding:5px;
    cursor:grab;
    box-shadow:
      0 7px 14px rgba(8,62,120,.20),
      inset 0 1px 0 rgba(255,255,255,.72),
      inset 0 -2px 0 rgba(0,45,110,.23);
    transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease;
    touch-action:none;
  }
  .word-card:hover{transform:translateY(-2px) scale(1.012)}
  .word-card:active{cursor:grabbing}
  .word-card.selected{
    transform:translateY(-3px) scale(1.035);
    box-shadow:0 10px 24px rgba(8,74,145,.28),0 0 0 4px rgba(74,207,255,.45),inset 0 1px 0 #fff;
  }
  .word-card.correcting{opacity:.18;pointer-events:none}
  .word-inner{
    width:100%;height:100%;
    border-radius:17px;
    background:
      radial-gradient(circle at 50% 0%,rgba(255,255,255,.99),rgba(255,253,245,.98) 50%,#f5f2e9 100%);
    display:flex;align-items:center;justify-content:center;
    padding:8px 8px 10px;
    box-shadow:inset 0 1px 1px #fff,inset 0 -3px 7px rgba(6,39,95,.08);
    overflow:hidden;
  }
  .word{
    display:block;
    width:100%;
    text-align:center;
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    font-weight:900;
    color:var(--navy);
    font-size:clamp(34px,5.0vw,69px);
    line-height:.95;
    letter-spacing:-1px;
    text-shadow:0 2px 0 #fff;
    white-space:nowrap;
  }
  .word.medium{font-size:clamp(31px,4.5vw,61px)}
  .word.longword{font-size:clamp(28px,4vw,53px)}

  .drag-ghost,.fly-card{
    position:fixed;
    z-index:9999;
    pointer-events:none;
    margin:0;
    transform-origin:center;
    will-change:transform,left,top,opacity;
  }
  .drag-ghost{
    opacity:.97;
    transform:scale(1.06) rotate(-1deg);
    box-shadow:0 18px 36px rgba(3,46,100,.33),0 0 0 4px rgba(255,255,255,.72);
  }
  .fly-card{transition:left .43s cubic-bezier(.18,.78,.2,1),top .43s cubic-bezier(.18,.78,.2,1),transform .43s cubic-bezier(.18,.78,.2,1),opacity .43s ease}

  .reward-star{
    position:fixed;z-index:10000;pointer-events:none;
    color:#ffc225;font-size:34px;
    text-shadow:0 2px 0 #d99600,0 0 12px rgba(255,228,82,.75);
    transition:left .62s cubic-bezier(.2,.75,.2,1),top .62s cubic-bezier(.2,.75,.2,1),transform .62s ease,opacity .62s ease;
  }

  /* ---------- instruction ---------- */
  .intro{
    position:absolute;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(4,47,91,.16);
    backdrop-filter:blur(3px);
    transition:opacity .28s ease,visibility .28s ease;
  }
  .intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .intro-card{
    width:min(650px,88%);
    border-radius:30px;
    padding:24px 24px 22px;
    background:rgba(255,255,255,.97);
    box-shadow:0 20px 50px rgba(7,47,97,.28),inset 0 -3px 0 rgba(7,73,143,.08);
    text-align:center;
    border:1px solid rgba(255,255,255,.95);
  }
  .intro-title{
    font-size:clamp(31px,4.2vw,54px);line-height:1;font-weight:900;margin:0 0 10px
  }
  .intro-copy{
    font-size:clamp(18px,2vw,25px);line-height:1.25;font-weight:800;margin:0 auto 18px;max-width:560px
  }
  .start-btn,.play-btn{
    border:0;border-radius:18px;padding:12px 28px;cursor:pointer;
    color:white;font-size:clamp(20px,2vw,27px);font-weight:900;
    background:linear-gradient(180deg,#34c985,#17a86a);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.34),0 7px 0 #0f8454,0 11px 18px rgba(10,104,67,.22);
    transition:transform .15s ease;
  }
  .start-btn:hover,.play-btn:hover{transform:translateY(-1px)}
  .start-btn:active,.play-btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 #0f8454}

  /* ---------- final reward ---------- */
  .final{
    position:absolute;inset:0;z-index:80;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 28%,rgba(255,255,255,.95),rgba(222,248,255,.87) 32%,rgba(67,189,255,.88) 100%);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .4s ease;
    overflow:hidden;
  }
  .final.show{opacity:1;visibility:visible;pointer-events:auto}
  .reward-panel{
    position:relative;
    width:min(760px,92%);
    height:min(630px,88vh);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
  }
  .bubble{
    position:relative;
    padding:14px 28px;
    background:#fff;
    border-radius:28px;
    box-shadow:0 10px 24px rgba(9,56,111,.18);
    font-size:clamp(34px,4.5vw,60px);
    font-weight:900;
    animation:bubblePop .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:17px solid #fff;
  }
  @keyframes bubblePop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}

  .pet-wrap{
    width:min(330px,44vh);aspect-ratio:1/1.05;
    animation:petHop 1.8s ease-in-out infinite;
    filter:drop-shadow(0 16px 18px rgba(4,52,105,.22));
  }
  @keyframes petHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}60%{transform:translateY(-4px)}}
  .pet-svg{width:100%;height:100%;overflow:visible}
  .pet-wave{transform-box:fill-box;transform-origin:50% 12%;animation:wavePaw 1.4s ease-in-out infinite}
  @keyframes wavePaw{0%,35%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}65%{transform:rotate(14deg)}80%{transform:rotate(-16deg)}}
  .wink-eye{transform-box:fill-box;transform-origin:center;animation:winkEye 3.2s infinite}
  @keyframes winkEye{0%,70%,78%,100%{transform:scaleY(1)}74%{transform:scaleY(.12)}}
  .tail{transform-box:fill-box;transform-origin:12% 55%;animation:tailWag 1.6s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(10deg)}}

  .star-rain{position:absolute;inset:0;pointer-events:none}
  .fall-star{
    position:absolute;top:-40px;color:#ffd54a;
    text-shadow:0 2px 0 #d39c00,0 0 8px rgba(255,235,89,.65);
    animation:fall linear infinite;
  }
  @keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}

  /* ---------- tiny-screen adaptations ---------- */
  @media(max-width:900px){
    .app{padding:8px 8px 10px;gap:8px}
    .topbar{grid-template-columns:1fr auto;min-height:62px;padding:8px 10px}
    .brand-title{font-size:22px}
    .progress-wrap{grid-column:1/-1;grid-row:2}
    .topbar{grid-template-rows:auto auto}
    .controls{grid-column:2;grid-row:1}
    .brand{grid-column:1;grid-row:1}
    .progress-row{margin-bottom:4px}
    .word-card{height:clamp(70px,8.6vh,96px)}
    .cards{gap:8px}
  }
  @media(max-height:730px){
    .app{grid-template-rows:auto auto auto}
    .scene{height:min(32vw,400px);min-height:220px}
    .topbar{min-height:58px}
    .brand-dot{width:38px;height:38px}
    .stars,.icon-btn{height:39px}
    .icon-btn{width:39px}
    .word-card{height:72px}
    .word{font-size:clamp(31px,4.8vw,58px)}
    .word.medium{font-size:clamp(29px,4.3vw,52px)}
    .word.longword{font-size:clamp(26px,3.8vw,46px)}
    .tray{padding-top:8px}
  }
  @media(max-width:620px){
    .brand-dot{display:none}
    .stars{padding:0 8px}
    .controls{gap:5px}
    .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
    .word-card{height:60px;border-radius:15px;padding:4px}
    .word-inner{border-radius:12px;padding:5px 3px 7px}
    .word{font-size:clamp(23px,7.2vw,34px)}
    .word.medium{font-size:clamp(21px,6.6vw,31px)}
    .word.longword{font-size:clamp(19px,6vw,28px)}
    .scene{height:36.5vw;min-height:190px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }


  /* ---------- polished start + reward overrides ---------- */
  .intro{
    background:
      radial-gradient(circle at 50% 36%,rgba(255,255,255,.20),transparent 28%),
      linear-gradient(180deg,rgba(6,54,116,.22),rgba(4,39,86,.34));
    backdrop-filter:blur(5px) saturate(1.06);
  }
  .intro-card.intro-polished{
    width:min(720px,91%);
    min-height:min(620px,84vh);
    border-radius:36px;
    padding:26px 34px 30px;
    background:
      radial-gradient(circle at 50% 0%,rgba(255,255,255,.98),rgba(255,255,255,.92) 50%,rgba(241,249,255,.95) 100%);
    border:2px solid rgba(255,255,255,.96);
    box-shadow:0 26px 64px rgba(3,44,97,.30),inset 0 -4px 0 rgba(8,88,170,.08),inset 0 2px 0 #fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;
    overflow:hidden;
    position:relative;
  }
  .intro-card.intro-polished::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 13% 18%,rgba(67,202,255,.22),transparent 17%),
      radial-gradient(circle at 87% 22%,rgba(172,91,246,.18),transparent 19%),
      linear-gradient(110deg,transparent 0 41%,rgba(255,255,255,.55) 47%,transparent 53% 100%);
    transform:translateX(-65%);animation:introSheen 5.2s ease-in-out infinite;
  }
  @keyframes introSheen{0%,60%{transform:translateX(-65%)}85%,100%{transform:translateX(65%)}}
  .intro-mascot-shell{
    width:clamp(138px,18vh,188px);aspect-ratio:1;position:relative;
    border-radius:50%;padding:7px;
    background:linear-gradient(145deg,#fff,#dff5ff 45%,#8ddcff 100%);
    box-shadow:0 12px 30px rgba(1,77,154,.22),inset 0 2px 0 #fff;
    animation:introBob 3.4s ease-in-out infinite;
    z-index:1;
  }
  @keyframes introBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
  .intro-mascot{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
  .intro-spark{position:absolute;color:#ffd12a;font-size:26px;text-shadow:0 2px 0 #d89600,0 0 12px rgba(255,221,49,.8);animation:sparkFloat 2.2s ease-in-out infinite}
  .intro-spark.s1{left:-10px;top:34%;animation-delay:-.4s}.intro-spark.s2{right:-8px;top:15%;font-size:20px;animation-delay:-1.1s}.intro-spark.s3{right:4px;bottom:6%;font-size:17px;animation-delay:-1.7s}
  @keyframes sparkFloat{0%,100%{transform:translateY(0) scale(.9) rotate(-7deg);opacity:.65}50%{transform:translateY(-8px) scale(1.14) rotate(8deg);opacity:1}}
  .intro-kicker{
    z-index:1;font-size:clamp(13px,1.5vw,18px);font-weight:900;letter-spacing:2.5px;color:#5b75a5;
    padding:7px 13px;border-radius:999px;background:#eef8ff;box-shadow:inset 0 0 0 1px #d6ecff;
  }
  .intro-polished .intro-title{
    z-index:1;margin:2px 0 4px;font-size:clamp(38px,5.2vw,66px);line-height:.96;letter-spacing:.3px;color:var(--navy);
    text-shadow:0 3px 0 #fff,0 8px 20px rgba(3,61,126,.12);
  }
  .sound-pair{z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(500px,96%);margin:2px 0 8px}
  .sound-pill{
    min-height:82px;border-radius:23px;padding:11px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:white;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 8px 16px rgba(8,57,111,.18);border:1px solid rgba(255,255,255,.55)
  }
  .sound-pill span{font-size:clamp(18px,2vw,25px);font-weight:900;line-height:1}.sound-pill b{font-size:clamp(25px,2.8vw,34px);line-height:1.05;margin-top:4px}
  .long-pill{background:linear-gradient(180deg,#268ff3,#0965c9)}
  .short-pill{background:linear-gradient(180deg,#a255e6,#7429ba)}
  .intro-polished .start-btn{z-index:1;min-width:190px;margin-top:2px;padding:13px 34px;border-radius:20px;font-size:clamp(22px,2.3vw,29px)}

  .feedback{
    top:4.5%;min-width:0;padding:8px 16px 8px 13px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(244,251,255,.98));
    border:2px solid rgba(255,255,255,.95);font-size:clamp(17px,1.8vw,23px);
    box-shadow:0 9px 22px rgba(4,52,105,.20),inset 0 -2px 0 rgba(10,77,144,.06);
  }
  .feedback.good::before{content:"★";display:inline-block;margin-right:7px;color:#ffc326;text-shadow:0 1px 0 #dc9400;animation:tinyPop .45s ease}
  .feedback.bad::before{content:"•";display:inline-block;margin-right:8px;color:#e96d89;font-size:1.25em}
  @keyframes tinyPop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1)}}

  .final{
    background:
      radial-gradient(circle at 50% 34%,rgba(255,255,255,.98),rgba(229,248,255,.96) 31%,rgba(110,210,255,.95) 70%,rgba(57,160,237,.98) 100%);
  }
  .reward-panel.reward-polished{
    width:min(780px,94%);height:min(680px,91vh);gap:8px;
    border-radius:42px;padding:28px 28px 24px;
    background:linear-gradient(180deg,rgba(255,255,255,.70),rgba(236,249,255,.42));
    border:2px solid rgba(255,255,255,.72);
    box-shadow:0 25px 65px rgba(4,55,111,.18),inset 0 2px 0 rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    overflow:hidden;
  }
  .reward-glow{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;top:19%;left:19%;background:radial-gradient(circle,rgba(255,240,110,.34),rgba(110,215,255,.20) 44%,transparent 70%);filter:blur(3px);animation:glowPulse 2.2s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{transform:scale(.95);opacity:.72}50%{transform:scale(1.07);opacity:1}}
  .reward-bubble{z-index:4;margin-bottom:2px;padding:12px 27px;border-radius:26px;font-size:clamp(34px,4.6vw,58px);box-shadow:0 10px 24px rgba(7,60,116,.16),inset 0 -2px 0 rgba(4,57,117,.04)}
  .reward-mascot-stage{z-index:3;position:relative;width:min(350px,44vh);aspect-ratio:1;display:grid;place-items:center;margin-top:3px;animation:rewardHop 2s ease-in-out infinite}
  @keyframes rewardHop{0%,100%{transform:translateY(0) rotate(-.5deg)}44%{transform:translateY(-12px) rotate(.6deg)}62%{transform:translateY(-4px)}}
  .reward-mascot{width:86%;height:86%;object-fit:cover;border-radius:50%;display:block;position:relative;z-index:2;filter:drop-shadow(0 16px 20px rgba(4,46,98,.23))}
  .reward-ring{position:absolute;border-radius:50%;inset:5%;border:5px solid rgba(255,255,255,.82);box-shadow:0 0 0 6px rgba(54,182,255,.16),0 0 30px rgba(255,244,116,.45);z-index:1;animation:ringPulse 2.6s ease-in-out infinite}
  .reward-ring.r2{inset:-1%;border-width:2px;border-color:rgba(255,225,77,.55);animation-delay:-1.3s}
  @keyframes ringPulse{0%,100%{transform:scale(.96);opacity:.62}50%{transform:scale(1.035);opacity:1}}
  .wink-flash{position:absolute;z-index:5;right:28%;top:34%;font-size:clamp(20px,3vh,30px);color:#fff6a8;text-shadow:0 0 12px #ffca28,0 2px 0 #e6a30c;opacity:0;animation:winkSpark 3.1s infinite}
  @keyframes winkSpark{0%,66%,82%,100%{opacity:0;transform:scale(.4) rotate(0)}71%,76%{opacity:1;transform:scale(1.3) rotate(35deg)}}
  .float-star{position:absolute;z-index:4;color:#ffd02d;text-shadow:0 2px 0 #d69300,0 0 12px rgba(255,224,72,.78);animation:rewardFloat 2.4s ease-in-out infinite}
  .fs1{left:0;top:18%;font-size:31px;animation-delay:-.2s}.fs2{right:-1%;top:28%;font-size:24px;animation-delay:-1.1s}.fs3{left:9%;bottom:10%;font-size:20px;animation-delay:-1.7s}.fs4{right:7%;bottom:6%;font-size:29px;animation-delay:-.7s}
  @keyframes rewardFloat{0%,100%{transform:translateY(3px) rotate(-8deg) scale(.92);opacity:.7}50%{transform:translateY(-9px) rotate(8deg) scale(1.12);opacity:1}}
  .reward-score{z-index:4;display:flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.84);box-shadow:0 7px 16px rgba(6,60,118,.12),inset 0 0 0 1px rgba(255,255,255,.9);font-size:clamp(18px,2vw,24px);font-weight:900;color:var(--navy)}
  .reward-score-star{color:#ffc328;font-size:1.35em;text-shadow:0 1px 0 #da9500}
  .reward-polished .play-btn{z-index:4;margin-top:4px;min-width:190px}

  @media(max-height:760px){
    .intro-card.intro-polished{min-height:0;height:88vh;padding:16px 28px;gap:8px}
    .intro-mascot-shell{width:clamp(108px,17vh,150px)}
    .sound-pill{min-height:68px}
    .reward-panel.reward-polished{height:91vh;padding:15px 24px;gap:4px}
    .reward-mascot-stage{width:min(280px,42vh)}
  }
  @media(max-width:620px){
    .intro-card.intro-polished{padding:20px 17px;min-height:0}
    .sound-pair{gap:8px}.sound-pill{min-height:68px;padding:8px}
    .reward-panel.reward-polished{padding:20px 14px}
    .reward-mascot-stage{width:min(270px,42vh)}
  }

</style>
</head>

<script>
(() => {
  "use strict";


  // Keep asynchronous effects scoped to the current attempt.
  const pendingTimers = new Set();
  const pendingFrames = new Set();
  let attempt = 0;
  function later(callback, delay) {
    const currentAttempt = attempt;
    const id = window.setTimeout(() => {
      pendingTimers.delete(id);
      if (currentAttempt === attempt) callback();
    }, delay);
    pendingTimers.add(id);
    return id;
  }
  function nextFrame(callback) {
    const currentAttempt = attempt;
    const id = window.requestAnimationFrame(time => {
      pendingFrames.delete(id);
      if (currentAttempt === attempt) callback(time);
    });
    pendingFrames.add(id);
    return id;
  }
  function cancelAttempt() {
    attempt++;
    pendingTimers.forEach(id => window.clearTimeout(id));
    pendingFrames.forEach(id => window.cancelAnimationFrame(id));
    pendingTimers.clear();
    pendingFrames.clear();
    document.querySelectorAll('.drag-ghost, .fly-card, .reward-star, .fly-star').forEach(el => el.remove());
  }

  const pages = [
    [
      {w:"bee",k:"long"},{w:"tree",k:"long"},{w:"feet",k:"long"},{w:"green",k:"long"},
      {w:"bed",k:"short"},{w:"pen",k:"short"},{w:"red",k:"short"},{w:"hen",k:"short"}
    ],
    [
      {w:"see",k:"long"},{w:"three",k:"long"},{w:"sheep",k:"long"},{w:"cheese",k:"long"},
      {w:"ten",k:"short"},{w:"leg",k:"short"},{w:"net",k:"short"},{w:"bell",k:"short"}
    ],
    [
      {w:"sleep",k:"long"},{w:"teeth",k:"long"},{w:"knee",k:"long"},{w:"week",k:"long"},
      {w:"desk",k:"short"},{w:"dress",k:"short"},{w:"egg",k:"short"},{w:"tent",k:"short"}
    ],
    [
      {w:"me",k:"long"},{w:"he",k:"long"},{w:"we",k:"long"},{w:"she",k:"long"},
      {w:"neck",k:"short"},{w:"wet",k:"short"},{w:"shell",k:"short"},{w:"step",k:"short"}
    ]
  ];

  const cardsEl = document.getElementById("cards");
  const progressFill = document.getElementById("progressFill");
  const taskLabel = document.getElementById("taskLabel");
  const pageCount = document.getElementById("pageCount");
  const starCount = document.getElementById("starCount");
  const starTarget = document.getElementById("starTarget");
  const feedback = document.getElementById("feedback");
  const zones = [...document.querySelectorAll(".drop-zone")];
  const intro = document.getElementById("intro");
  const final = document.getElementById("final");
  const soundBtn = document.getElementById("soundBtn");
  const restartBtn = document.getElementById("restartBtn");
  const startBtn = document.getElementById("startBtn");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const starRain = document.getElementById("starRain");
  const rewardScore = document.getElementById("rewardScore");

  let pageIndex = 0;
  let stars = 0;
  let pageDone = 0;
  let selectedCard = null;
  let soundOn = true;
  let audioCtx = null;
  let transitioning = false;
  let drag = null;
  let feedbackTimer = null;

  const total = pages.reduce((n,p)=>n+p.length,0);

  function ensureAudio(){
    if(!soundOn) return null;
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, duration=.12, type="sine", gain=.04, delay=0){
    const ctx = ensureAudio();
    if(!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + delay + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + delay);
    o.stop(ctx.currentTime + delay + duration + .03);
  }
  function soundGood(){ tone(660,.12,"sine",.05,0); tone(880,.16,"sine",.045,.09); }
  function soundBad(){ tone(220,.12,"triangle",.035,0); tone(185,.13,"triangle",.03,.09); }
  function soundFinish(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.04,i*.09)); }

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }

  function fontClass(word){
    if(word.length >= 7) return "longword";
    if(word.length >= 6) return "medium";
    return "";
  }

  function renderPage(){
    transitioning = false;
    selectedCard = null;
    zones.forEach(z=>z.classList.remove("active","hovered","correct","wrong"));
    cardsEl.innerHTML = "";
    pageDone = 0;
    taskLabel.textContent = `Task ${pageIndex+1}/4`;
    pageCount.textContent = `0/${pages[pageIndex].length}`;
    const items = shuffle(pages[pageIndex]);
    items.forEach((item,idx)=>{
      const card = document.createElement("button");
      card.className = "word-card";
      card.type = "button";
      card.dataset.kind = item.k;
      card.dataset.word = item.w;
      card.dataset.id = `${pageIndex}-${idx}-${item.w}`;
      card.setAttribute("aria-label", item.w);
      card.innerHTML = `<span class="word-inner"><span class="word ${fontClass(item.w)}">${item.w}</span></span>`;
      wireCard(card);
      cardsEl.appendChild(card);
    });
    updateHUD();
  }

  function updateHUD(){
    starCount.textContent = `${stars}/${total}`;
    if(rewardScore) rewardScore.textContent = `${stars}/${total}`;
    pageCount.textContent = `${pageDone}/${pages[pageIndex].length}`;
    progressFill.style.width = `${(stars/total)*100}%`;
  }

  function selectCard(card){
    if(transitioning || !card || card.classList.contains("correcting")) return;
    if(selectedCard === card){
      card.classList.remove("selected");
      selectedCard = null;
      zones.forEach(z=>z.classList.remove("active"));
      return;
    }
    if(selectedCard) selectedCard.classList.remove("selected");
    selectedCard = card;
    card.classList.add("selected");
    zones.forEach(z=>z.classList.add("active"));
    tone(460,.06,"sine",.018);
  }

  function showFeedback(text, good){
    clearTimeout(feedbackTimer);
    feedback.textContent = text;
    feedback.className = `feedback show ${good ? "good":"bad"}`;
    feedbackTimer = later(()=>feedback.classList.remove("show"), 650);
  }

  function flashZone(zone, state){
    zone.classList.remove("correct","wrong");
    void zone.offsetWidth;
    zone.classList.add(state);
    later(()=>zone.classList.remove(state), 520);
  }

  function rewardToCounter(startX,startY){
    const s=document.createElement("div");
    s.className="reward-star";
    s.textContent="★";
    s.style.left=`${startX-17}px`;
    s.style.top=`${startY-17}px`;
    document.body.appendChild(s);
    const r=starTarget.getBoundingClientRect();
    nextFrame(()=>{
      s.style.left=`${r.left+r.width/2-17}px`;
      s.style.top=`${r.top+r.height/2-17}px`;
      s.style.transform="scale(.42) rotate(260deg)";
      s.style.opacity=".25";
    });
    later(()=>s.remove(),680);
  }

  function makeFlyingClone(card, rect){
    const clone = card.cloneNode(true);
    clone.classList.remove("selected","correcting");
    clone.classList.add("fly-card");
    clone.style.width = `${rect.width}px`;
    clone.style.height = `${rect.height}px`;
    clone.style.left = `${rect.left}px`;
    clone.style.top = `${rect.top}px`;
    document.body.appendChild(clone);
    return clone;
  }

  function animateCorrect(card, zone, startRectOverride){
    if(!card.isConnected) return;
    const start = startRectOverride || card.getBoundingClientRect();
    const clone = makeFlyingClone(card,start);
    card.classList.add("correcting");
    const zr = zone.getBoundingClientRect();

    // Aim for the actual black slot near the top of each mailbox.
    const tx = zr.left + zr.width*.5 - start.width*.5;
    const ty = zr.top + zr.height*.18 - start.height*.5;

    nextFrame(()=>{
      clone.style.left = `${tx}px`;
      clone.style.top = `${ty}px`;
      clone.style.transform = "scale(.30) rotate(-2deg)";
      clone.style.opacity = ".15";
    });

    rewardToCounter(zr.left+zr.width*.5, zr.top+zr.height*.24);
    later(()=>clone.remove(),470);
    later(()=>{
      card.remove();
      pageDone++;
      stars++;
      updateHUD();
      if(pageDone === pages[pageIndex].length){
        transitioning = true;
        later(nextPage,780);
      }
    },400);
  }

  function animateWrong(card, zone, startRectOverride){
    flashZone(zone,"wrong");
    soundBad();
    showFeedback("Oops!",false);
    if(startRectOverride){
      // drag clone has already been removed; create a quick return animation
      const original = card.getBoundingClientRect();
      const c = makeFlyingClone(card,startRectOverride);
      c.style.transition = "left .33s cubic-bezier(.2,.8,.2,1),top .33s cubic-bezier(.2,.8,.2,1),transform .33s ease,opacity .33s ease";
      c.style.transform = "scale(.98)";
      nextFrame(()=>{
        c.style.left=`${original.left}px`;
        c.style.top=`${original.top}px`;
        c.style.transform="scale(1)";
      });
      later(()=>c.remove(),360);
    } else {
      card.animate([
        {transform:"translateX(0)"},
        {transform:"translateX(-7px)"},
        {transform:"translateX(7px)"},
        {transform:"translateX(-4px)"},
        {transform:"translateX(0)"}
      ],{duration:330,easing:"ease"});
    }
  }

  function submit(card, zone, startRectOverride=null){
    if(transitioning || !card || !zone || !card.isConnected) return;
    const good = card.dataset.kind === zone.dataset.kind;
    if(selectedCard){
      selectedCard.classList.remove("selected");
      selectedCard=null;
      zones.forEach(z=>z.classList.remove("active"));
    }
    zones.forEach(z=>z.classList.remove("hovered"));
    if(good){
      flashZone(zone,"correct");
      soundGood();
      showFeedback(["Great!","Well done!","Yes!"][Math.floor(Math.random()*3)],true);
      animateCorrect(card,zone,startRectOverride);
    }else{
      animateWrong(card,zone,startRectOverride);
    }
  }

  function wireCard(card){
    let sx=0,sy=0,moved=false,pid=null,ghost=null,grabDX=0,grabDY=0,lastRect=null;

    card.addEventListener("pointerdown",e=>{
      if(transitioning) return;
      if(e.pointerType==="mouse" && e.button!==0) return;
      ensureAudio();
      sx=e.clientX;sy=e.clientY;moved=false;pid=e.pointerId;
      lastRect=card.getBoundingClientRect();
      grabDX=e.clientX-lastRect.left;grabDY=e.clientY-lastRect.top;
      card.setPointerCapture?.(pid);
    });

    card.addEventListener("pointermove",e=>{
      if(pid!==e.pointerId) return;
      const dx=e.clientX-sx,dy=e.clientY-sy;
      if(!moved && Math.hypot(dx,dy)>8){
        moved=true;
        if(selectedCard){selectedCard.classList.remove("selected");selectedCard=null}
        zones.forEach(z=>z.classList.add("active"));
        ghost=card.cloneNode(true);
        ghost.classList.remove("selected");
        ghost.classList.add("drag-ghost");
        ghost.style.width=`${lastRect.width}px`;
        ghost.style.height=`${lastRect.height}px`;
        ghost.style.left=`${lastRect.left}px`;
        ghost.style.top=`${lastRect.top}px`;
        card.style.opacity=".3";
        document.body.appendChild(ghost);
      }
      if(moved && ghost){
        ghost.style.left=`${e.clientX-grabDX}px`;
        ghost.style.top=`${e.clientY-grabDY}px`;
        const under=document.elementFromPoint(e.clientX,e.clientY);
        const z=under && under.closest ? under.closest(".drop-zone") : null;
        zones.forEach(zone=>zone.classList.toggle("hovered",zone===z));
      }
      if(moved) e.preventDefault();
    });

    card.addEventListener("pointerup",e=>{
      if(pid!==e.pointerId) return;
      try{card.releasePointerCapture?.(pid)}catch(_){}
      pid=null;
      if(moved){
        const ghostRect=ghost?.getBoundingClientRect() || lastRect;
        const under=document.elementFromPoint(e.clientX,e.clientY);
        const zone=under && under.closest ? under.closest(".drop-zone") : null;
        if(ghost) ghost.remove();
        card.style.opacity="";
        zones.forEach(z=>z.classList.remove("hovered","active"));
        if(zone) submit(card,zone,ghostRect);
        else{
          const original=card.getBoundingClientRect();
          const c=makeFlyingClone(card,ghostRect);
          c.style.transition="left .28s ease,top .28s ease,transform .28s ease,opacity .28s ease";
          nextFrame(()=>{c.style.left=`${original.left}px`;c.style.top=`${original.top}px`;c.style.transform="scale(1)"});
          later(()=>c.remove(),310);
        }
      }else{
        selectCard(card);
      }
    });

    card.addEventListener("pointercancel",()=>{
      pid=null;
      if(ghost) ghost.remove();
      ghost=null;
      card.style.opacity="";
      zones.forEach(z=>z.classList.remove("hovered","active"));
    });
  }

  zones.forEach(zone=>{
    zone.addEventListener("click",()=>{
      ensureAudio();
      if(selectedCard) submit(selectedCard,zone);
    });
    zone.addEventListener("pointerenter",()=>{ if(drag) zone.classList.add("hovered") });
    zone.addEventListener("pointerleave",()=>zone.classList.remove("hovered"));
  });

  function nextPage(){
    if(pageIndex < pages.length-1){
      pageIndex++;
      renderPage();
    }else{
      soundFinish();
      if(rewardScore) rewardScore.textContent = `${total}/${total}`;
      buildStarRain();
      final.classList.add("show");
    }
  }

  function buildStarRain(){
    starRain.innerHTML="";
    for(let i=0;i<32;i++){
      const s=document.createElement("span");
      s.className="fall-star";
      s.textContent="★";
      s.style.left=`${Math.random()*100}%`;
      s.style.fontSize=`${12+Math.random()*16}px`;
      s.style.opacity=`${.35+Math.random()*.55}`;
      s.style.animationDuration=`${4.3+Math.random()*4.5}s`;
      s.style.animationDelay=`${-Math.random()*7}s`;
      starRain.appendChild(s);
    }
  }

  function resetGame(showIntro=false){
    cancelAttempt();
    feedback.classList.remove('show');
    pageIndex=0;stars=0;pageDone=0;selectedCard=null;transitioning=false;
    final.classList.remove("show");
    if(showIntro) intro.classList.remove("hidden");
    else intro.classList.add("hidden");
    renderPage();
    updateHUD();
  }

  startBtn.addEventListener("click",()=>{
    ensureAudio();
    intro.classList.add("hidden");
    tone(523,.09,"sine",.03);
    tone(659,.12,"sine",.025,.07);
  });
  soundBtn.addEventListener("click",()=>{
    soundOn=!soundOn;
    soundBtn.textContent=soundOn ? "♪" : "×";
    soundBtn.setAttribute("aria-label",soundOn ? "Sound on":"Sound off");
    if(soundOn) tone(620,.08,"sine",.025);
  });
  restartBtn.addEventListener("click",()=>resetGame(true));
  playAgainBtn.addEventListener("click",()=>resetGame(false));

  renderPage();
})();
</script>
</body>
