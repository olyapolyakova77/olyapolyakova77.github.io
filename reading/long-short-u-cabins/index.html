<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Long & Short U Sorter</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff2ff;font-family:"Arial Rounded MT Bold","Trebuchet MS","Avenir Next Rounded","Noto Sans",sans-serif;color:#06275f}
  button{font:inherit}
  :root{--top-h:clamp(52px,7vh,66px);--tray-h:clamp(188px,calc(100vh - var(--top-h) - 37.9834vw - 40px),290px);--blue:#075bd6;--deep:#063275;--orange:#f37a08;--card:#ffffff;--ink:#06275f}
  #game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#38a8f3 0 9%,#dff5ff 9% 100%);user-select:none;-webkit-user-select:none}
  .topbar{height:var(--top-h);display:grid;grid-template-columns:minmax(190px,1fr) minmax(250px,1.2fr) minmax(260px,1fr);align-items:center;gap:14px;padding:7px clamp(10px,2vw,26px);background:linear-gradient(180deg,#1599f3,#0c79dc);box-shadow:0 5px 16px #034f9f4d;position:relative;z-index:50}
  .pill{height:100%;min-height:40px;border:2px solid #ffffffb8;border-radius:18px;background:linear-gradient(180deg,#0d61c8,#063d92);box-shadow:inset 0 2px 0 #ffffff55,0 3px 8px #003c7e52;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;text-shadow:0 2px 2px #00295f6b;white-space:nowrap}
  .brand{font-size:clamp(18px,2vw,28px);justify-self:start;padding:0 16px}
  .brand-dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#9de9ff,#1aa7ff 48%,#0560c5 49%);box-shadow:inset 2px 2px 5px #ffffffaa,0 0 0 3px #ffffff3d;transform:rotate(7deg)}
  .center-status{display:grid;grid-template-columns:auto minmax(90px,1fr);gap:11px;height:100%;align-items:center}
  .task-pill{padding:0 16px;font-size:clamp(16px,1.7vw,23px)}
  .progress-shell{height:18px;border-radius:999px;background:#eaf6ff;border:2px solid #fff;box-shadow:inset 0 2px 5px #1f5b8d55;overflow:hidden}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#45e4cd,#4cb8ff);border-radius:999px;transition:width .35s ease}
  .right-ui{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:9px}
  .star-pill{min-width:108px;padding:0 14px;font-size:clamp(16px,1.8vw,24px)}
  .star-shape{width:25px;height:25px;flex:0 0 25px;background:linear-gradient(135deg,#fff279 0 28%,#ffd21c 29% 63%,#ff9f00 64%);clip-path:polygon(50% 0,62% 34%,98% 37%,70% 58%,79% 94%,50% 73%,21% 94%,30% 58%,2% 37%,38% 34%);filter:drop-shadow(0 2px 1px #8b4a00)}
  .ui-btn{height:42px;border:2px solid #fff;white-space:nowrap;border-radius:15px;background:linear-gradient(#1474dc,#07429d);box-shadow:inset 0 2px 0 #ffffff61,0 3px 7px #003b7655;color:white;font-weight:900;padding:0 12px;cursor:pointer;text-shadow:0 2px 2px #00346f;transition:.18s transform,.18s filter}
  .ui-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .ui-btn:active{transform:translateY(1px) scale(.98)}
  .stage-wrap{position:relative;width:100%;height:calc(100vh - var(--top-h) - var(--tray-h));min-height:280px;overflow:hidden;background:linear-gradient(#62c5ff,#a7e1ff 55%,#e9cc9f 56%);}
  .scene-fit{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .scene-box{position:relative;width:100%;height:auto;aspect-ratio:1448/550;max-height:100%;}
  .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;animation:sceneBreath 8s ease-in-out infinite alternate;transform-origin:center bottom}
  @keyframes sceneBreath{from{filter:saturate(1.02) brightness(1);transform:scale(1)}to{filter:saturate(1.07) brightness(1.025);transform:scale(1.004)}}
  .sky-sheen{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 45% 14%,#ffffff38 0 5%,transparent 16%);mix-blend-mode:screen;animation:sheen 5s ease-in-out infinite alternate}
  @keyframes sheen{to{opacity:.55;transform:translateX(1.5%)}}
  .dropzone{position:absolute;top:27%;height:67%;border-radius:9% 9% 4% 4%;z-index:8;cursor:pointer;transition:filter .2s,box-shadow .2s,transform .2s;background:transparent;border:3px solid transparent}
  .dropzone.long{left:13.6%;width:35.1%}
  .dropzone.short{left:52.4%;width:35.4%}
  .dropzone.ready{border-color:#ffffffc9;box-shadow:inset 0 0 30px #ffffff55,0 0 26px #ffe75abf;filter:brightness(1.08);transform:scale(1.012)}
  .dropzone.correct{animation:zoneGlow .55s ease}
  .dropzone.wrong{animation:zoneWrong .42s ease}
  @keyframes zoneGlow{0%,100%{box-shadow:none}45%{box-shadow:inset 0 0 35px #faff9a,0 0 36px #fff05d;filter:brightness(1.14)}}
  @keyframes zoneWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}55%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  .placed-grid{position:absolute;left:12%;right:12%;bottom:8%;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;align-items:end;pointer-events:none}
  .placed-chip{min-width:0;min-height:34px;padding:5px 8px;border-radius:12px;background:linear-gradient(#fff,#eef7ff);border:2px solid #ffffff;box-shadow:0 3px 8px #001c4e55,inset 0 -2px 0 #9fcfff;color:#06275f;text-align:center;font-size:clamp(13px,1.45vw,22px);font-weight:900;line-height:1;animation:chipIn .34s cubic-bezier(.18,.84,.31,1.28)}
  @keyframes chipIn{from{opacity:0;transform:scale(.55) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .instruction{position:absolute;z-index:24;top:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;transition:opacity .35s,transform .35s;pointer-events:none}
  .instruction.hide{opacity:0;transform:translate(-50%,-14px) scale(.96)}
  .avatar{width:clamp(54px,6.2vw,82px);height:clamp(54px,6.2vw,82px);border-radius:50%;border:4px solid #fff;box-shadow:0 4px 12px #004a8f66}
  .bubble{position:relative;padding:11px 20px;border-radius:22px;background:#fff;box-shadow:0 4px 10px #07518d52;border:2px solid #e9f4ff;color:#08265f;font-size:clamp(17px,2vw,28px);font-weight:900;line-height:1.04;text-align:center;max-width:420px}
  .bubble:before{content:"";position:absolute;left:-12px;top:50%;width:24px;height:24px;background:#fff;transform:translateY(-50%) rotate(45deg);border-left:2px solid #e9f4ff;border-bottom:2px solid #e9f4ff}
  .tray{position:absolute;left:0;right:0;bottom:0;height:var(--tray-h);z-index:40;padding:clamp(9px,1.2vh,15px) clamp(10px,1.6vw,22px) clamp(10px,1.5vh,18px);background:linear-gradient(180deg,#e7c9a2 0,#d5ad7e 100%);box-shadow:0 -8px 18px #4d2f1638,inset 0 2px 0 #fff8}
  .cards{height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
  .card{position:relative;display:flex;align-items:center;justify-content:center;border:none;border-radius:22px;background:linear-gradient(180deg,#ffffff,#f6f9fe);box-shadow:0 5px 0 #75a6cc,0 8px 13px #57391e2e,inset 0 0 0 3px #d7ebfb;padding:8px 14px;color:var(--ink);font-size:clamp(26px,3.1vw,48px);font-weight:900;line-height:.95;letter-spacing:.2px;cursor:grab;touch-action:none;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;overflow:hidden}
  .card:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 6px 0 #75a6cc,0 12px 16px #57391e35,inset 0 0 0 3px #cce7fb}
  .card:active{cursor:grabbing}
  .card.selected{transform:translateY(-3px) scale(1.035);box-shadow:0 6px 0 #4a8ec6,0 0 0 5px #ffe56a,0 12px 18px #57391e33,inset 0 0 0 3px #fff}
  .card.wrong-card{animation:cardWrong .42s ease}
  .card.done{visibility:hidden;pointer-events:none}
  @keyframes cardWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  .drag-ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;opacity:.94;transform:translate(-50%,-50%) scale(1.05);box-shadow:0 20px 30px #00265555!important;width:min(300px,30vw);height:82px}
  .fly-card{position:fixed;z-index:1100;display:flex;align-items:center;justify-content:center;border-radius:22px;background:linear-gradient(180deg,#fff,#f6f9fe);box-shadow:0 12px 22px #00265555,inset 0 0 0 3px #d7ebfb;color:#06275f;font-weight:900;transition:left .5s cubic-bezier(.2,.75,.22,1),top .5s cubic-bezier(.2,.75,.22,1),width .5s,height .5s,font-size .5s,opacity .5s,transform .5s;pointer-events:none}
  .toast{position:absolute;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:11px 25px;border-radius:999px;background:#fff;border:3px solid #74c3ff;box-shadow:0 9px 25px #00569e55;color:#06275f;font-size:clamp(25px,3.8vw,52px);font-weight:900;pointer-events:none;transition:.2s}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.good{border-color:#ffdf55;box-shadow:0 0 25px #ffdf55aa,0 9px 25px #00569e44}
  .toast.bad{border-color:#ff9a82}
  .reward-star{position:fixed;width:24px;height:24px;z-index:1200;background:linear-gradient(135deg,#fff58d,#ffd31e 55%,#ff9b00);clip-path:polygon(50% 0,62% 34%,98% 37%,70% 58%,79% 94%,50% 73%,21% 94%,30% 58%,2% 37%,38% 34%);filter:drop-shadow(0 2px 2px #8f4d00);pointer-events:none;transition:left .62s cubic-bezier(.2,.8,.2,1),top .62s cubic-bezier(.2,.8,.2,1),transform .62s,opacity .62s}
  .reward{position:absolute;inset:0;z-index:2000;display:none;background:#68c2f5;overflow:hidden}
  .reward.show{display:block}
  .reward-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:rewardBreathe 2.2s ease-in-out infinite alternate}
  @keyframes rewardBreathe{from{transform:scale(1)}to{transform:scale(1.012)}}
  .play-again-hotspot{position:absolute;z-index:6;left:50%;bottom:7.2%;transform:translateX(-50%);width:min(38vw,330px);height:clamp(60px,9vh,86px);border:none;border-radius:999px;background:transparent;color:transparent;cursor:pointer}
  .play-again-hotspot:focus-visible{outline:5px solid #fff;outline-offset:4px}
  .star-rain{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .rain-star{position:absolute;top:-12%;width:18px;height:18px;background:linear-gradient(135deg,#fffaa8,#ffd423 55%,#ff9f00);clip-path:polygon(50% 0,62% 34%,98% 37%,70% 58%,79% 94%,50% 73%,21% 94%,30% 58%,2% 37%,38% 34%);filter:drop-shadow(0 2px 2px #9c5c00);animation:fall var(--dur) linear infinite;animation-delay:var(--delay);opacity:.9}
  @keyframes fall{to{transform:translate(var(--drift),125vh) rotate(540deg)}}
  .celebrate{position:absolute;z-index:5;left:16%;top:11%;width:33%;height:63%;pointer-events:none;animation:petBounce 1.2s ease-in-out infinite}
  @keyframes petBounce{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-12px) rotate(.5deg)}}
  @media (max-width:900px){
    .topbar{grid-template-columns:1fr 1.15fr 1fr;gap:7px;padding-inline:7px}
    .brand{padding:0 9px;font-size:clamp(14px,2.3vw,21px)}
    .brand-dot{width:18px;height:18px;flex-basis:18px}
    .star-pill{min-width:85px;padding:0 9px}
    .ui-btn{padding:0 9px;font-size:13px}
    .card{font-size:clamp(22px,4vw,36px);border-radius:17px;padding:5px 8px}
    .placed-chip{font-size:clamp(11px,2vw,18px);padding:4px 5px}
    .instruction{top:1%}
    .bubble{padding:8px 13px;max-width:310px}
  }
  @media (orientation:portrait) and (max-width:900px){
    :root{--tray-h:calc(100vh - var(--top-h) - 37.9834vw - 40px)}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
    .card{font-size:clamp(24px,5vw,38px)}
  }
  @media (max-height:690px){
    :root{--top-h:50px;--tray-h:174px}
    .ui-btn{height:36px}
    .card{font-size:clamp(24px,3vw,42px);border-radius:16px}
    .tray{padding-top:8px;padding-bottom:9px}
    .placed-chip{min-height:26px;padding:3px 6px}
  }
  @media (max-width:620px){
    .brand span.label{display:none}
    .brand{min-width:52px;justify-content:center}
    .center-status{grid-template-columns:1fr}
    .progress-shell{display:none}
    .right-ui{gap:4px}
    .ui-btn{width:40px;padding:0;font-size:0}
    .ui-btn.sound:after{content:"S";font-size:15px}
    .ui-btn.restart:after{content:"↻";font-size:22px}
    .cards{gap:7px}
    .card{font-size:clamp(19px,5.2vw,31px);padding-inline:4px}
    .instruction .avatar{display:none}
    .bubble:before{display:none}
    .bubble{font-size:clamp(14px,4vw,20px)}
  }
</style>
</head>

      <button class="ui-btn sound" id="soundBtn" type="button">Sound: ON</button>

<script>
(()=>{
  'use strict';
  const TASKS=[
    [
      {w:'cube',z:'long'},{w:'tube',z:'long'},{w:'cute',z:'long'},{w:'mule',z:'long'},
      {w:'sun',z:'short'},{w:'bus',z:'short'},{w:'cup',z:'short'},{w:'duck',z:'short'}
    ],
    [
      {w:'use',z:'long'},{w:'huge',z:'long'},{w:'mute',z:'long'},{w:'student',z:'long'},
      {w:'fun',z:'short'},{w:'bug',z:'short'},{w:'nut',z:'short'},{w:'plum',z:'short'}
    ],
    [
      {w:'tune',z:'long'},{w:'dune',z:'long'},{w:'music',z:'long'},{w:'pupil',z:'long'},
      {w:'luck',z:'short'},{w:'drum',z:'short'},{w:'jump',z:'short'},{w:'run',z:'short'}
    ]
  ];
  const TOTAL=TASKS.reduce((a,t)=>a+t.length,0);
  let taskIndex=0, totalStars=0, solvedInTask=0, selected=null, soundOn=true, transitioning=false;
  let audioCtx=null, touchDrag=null, mouseDragging=null, instructionDismissed=false;
  const cardsEl=document.getElementById('cards');
  const taskLabel=document.getElementById('taskLabel');
  const starText=document.getElementById('starText');
  const progressFill=document.getElementById('progressFill');
  const toast=document.getElementById('toast');
  const instruction=document.getElementById('instruction');
  const zones=[...document.querySelectorAll('.dropzone')];
  const placedLong=document.getElementById('placedLong');
  const placedShort=document.getElementById('placedShort');
  const soundBtn=document.getElementById('soundBtn');
  const reward=document.getElementById('reward');
  const playAgain=document.getElementById('playAgain');

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }
  function updateUI(){
    taskLabel.textContent=`Task ${taskIndex+1} / ${TASKS.length}`;
    starText.textContent=`${totalStars} / ${TOTAL}`;
    progressFill.style.width=`${(totalStars/TOTAL)*100}%`;
  }
  function dismissInstruction(){
    if(!instructionDismissed){instructionDismissed=true;instruction.classList.add('hide');setTimeout(()=>instruction.style.display='none',360)}
  }
  function renderTask(){
    transitioning=false; selected=null; solvedInTask=0; mouseDragging=null;
    placedLong.innerHTML=''; placedShort.innerHTML=''; cardsEl.innerHTML='';
    if(taskIndex===0 && !instructionDismissed){instruction.style.display='flex';requestAnimationFrame(()=>instruction.classList.remove('hide'))}else{instruction.style.display='none'}
    shuffle(TASKS[taskIndex]).forEach((item,idx)=>{
      const b=document.createElement('button');
      b.type='button';b.className='card';b.textContent=item.w;b.dataset.zone=item.z;b.dataset.word=item.w;b.dataset.id=`${taskIndex}-${idx}`;b.draggable=true;
      b.setAttribute('aria-label',`${item.w}. Choose the correct cabin.`);
      bindCard(b); cardsEl.appendChild(b);
    });
    updateUI();
  }
  function bindCard(card){
    card.addEventListener('click',e=>{
      if(transitioning||card.classList.contains('done')||mouseDragging===card)return;
      dismissInstruction();
      if(selected===card){card.classList.remove('selected');selected=null;zones.forEach(z=>z.classList.remove('ready'));return}
      document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
      selected=card;card.classList.add('selected');zones.forEach(z=>z.classList.add('ready'));
    });
    card.addEventListener('dragstart',e=>{
      if(transitioning||card.classList.contains('done')){e.preventDefault();return}
      dismissInstruction(); mouseDragging=card; selected=null;card.classList.remove('selected');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',card.dataset.id);zones.forEach(z=>z.classList.add('ready'));
      setTimeout(()=>card.style.opacity='.55',0);
    });
    card.addEventListener('dragend',()=>{card.style.opacity='';zones.forEach(z=>z.classList.remove('ready'));setTimeout(()=>{mouseDragging=null},50)});
    card.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'||transitioning||card.classList.contains('done'))return;
      dismissInstruction(); e.preventDefault();
      const r=card.getBoundingClientRect();
      const ghost=card.cloneNode(true);ghost.className='card drag-ghost';ghost.draggable=false;ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);
      touchDrag={card,ghost,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY};card.setPointerCapture?.(e.pointerId);zones.forEach(z=>z.classList.add('ready'));
    });
    card.addEventListener('pointermove',e=>{
      if(!touchDrag||touchDrag.pointerId!==e.pointerId)return;e.preventDefault();touchDrag.ghost.style.left=e.clientX+'px';touchDrag.ghost.style.top=e.clientY+'px';
    });
    const finishTouch=e=>{
      if(!touchDrag||touchDrag.pointerId!==e.pointerId)return;e.preventDefault();
      const {card,ghost}=touchDrag;ghost.remove();touchDrag=null;zones.forEach(z=>z.classList.remove('ready'));
      const target=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.dropzone');
      if(target)attempt(card,target);else wrongReturn(card,null,false);
    };
    card.addEventListener('pointerup',finishTouch);card.addEventListener('pointercancel',finishTouch);
  }
  zones.forEach(zone=>{
    zone.addEventListener('dragover',e=>{if(mouseDragging){e.preventDefault();e.dataTransfer.dropEffect='move';zone.classList.add('ready')}});
    zone.addEventListener('dragleave',()=>{if(mouseDragging)zone.classList.remove('ready')});
    zone.addEventListener('drop',e=>{e.preventDefault();if(mouseDragging)attempt(mouseDragging,zone);zones.forEach(z=>z.classList.remove('ready'))});
    zone.addEventListener('click',()=>{if(selected&&!transitioning)attempt(selected,zone)});
  });
  function attempt(card,zone){
    if(!card||card.classList.contains('done')||transitioning)return;
    const isRight=card.dataset.zone===zone.dataset.zone;
    if(isRight)correctMove(card,zone);else wrongReturn(card,zone,true);
  }
  function correctMove(card,zone){
    selected=null;document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));zones.forEach(z=>z.classList.remove('ready'));
    card.draggable=false;card.style.pointerEvents='none';
    const a=card.getBoundingClientRect(),z=zone.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='fly-card';fly.textContent=card.dataset.word;
    Object.assign(fly.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px',fontSize:getComputedStyle(card).fontSize});document.body.appendChild(fly);card.style.opacity='0';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fly.style.left=(z.left+z.width*.38)+'px';fly.style.top=(z.top+z.height*.61)+'px';fly.style.width=Math.max(82,z.width*.28)+'px';fly.style.height=Math.max(36,z.height*.16)+'px';fly.style.fontSize='18px';fly.style.transform='scale(.72)';fly.style.opacity='.96';
    }));
    zone.classList.remove('wrong');zone.classList.add('correct');setTimeout(()=>zone.classList.remove('correct'),570);
    playCorrect();showToast(['Great!','Well done!','Yes!'][totalStars%3],true);launchStar(card);
    setTimeout(()=>{
      fly.remove();card.classList.add('done');card.style.opacity='';
      const chip=document.createElement('div');chip.className='placed-chip';chip.textContent=card.dataset.word;(zone.dataset.zone==='long'?placedLong:placedShort).appendChild(chip);
      totalStars++;solvedInTask++;updateUI();
      if(solvedInTask===TASKS[taskIndex].length)completeTask();
    },510);
  }
  function wrongReturn(card,zone,show=true){
    document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));selected=null;zones.forEach(z=>z.classList.remove('ready'));
    card.classList.remove('wrong-card');void card.offsetWidth;card.classList.add('wrong-card');setTimeout(()=>card.classList.remove('wrong-card'),450);
    if(zone){zone.classList.remove('wrong');void zone.offsetWidth;zone.classList.add('wrong');setTimeout(()=>zone.classList.remove('wrong'),450)}
    if(show){playWrong();showToast('Oops!',false)}
  }
  function completeTask(){
    transitioning=true;
    if(taskIndex<TASKS.length-1){
      setTimeout(()=>{taskIndex++;cardsEl.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(18px)'}],{duration:230,fill:'forwards'}).onfinish=()=>{renderTask();cardsEl.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,fill:'forwards'})}},760);
    }else{setTimeout(showReward,720)}
  }
  function showToast(text,good){
    toast.textContent=text;toast.className='toast '+(good?'good':'bad')+' show';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),620);
  }
  function launchStar(fromEl){
    const from=fromEl.getBoundingClientRect();const target=document.querySelector('.star-pill').getBoundingClientRect();const s=document.createElement('div');s.className='reward-star';s.style.left=(from.left+from.width/2-12)+'px';s.style.top=(from.top+from.height/2-12)+'px';document.body.appendChild(s);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.left=(target.left+22)+'px';s.style.top=(target.top+target.height/2-12)+'px';s.style.transform='scale(.55) rotate(420deg)';s.style.opacity='.92'}));setTimeout(()=>s.remove(),680);
  }
  function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
  function tone(freq,when,dur,type='sine',vol=.055){
    if(!soundOn)return;ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+when);g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+when+.018);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+dur);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur+.03)
  }
  function playCorrect(){tone(660,0,.16,'sine',.05);tone(880,.09,.19,'sine',.045);tone(1100,.18,.22,'triangle',.035)}
  function playWrong(){tone(230,0,.14,'triangle',.035);tone(185,.11,.18,'sine',.03)}
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound: ON':'Sound: OFF';if(soundOn){ensureAudio();tone(720,0,.10)}});
  document.getElementById('restartBtn').addEventListener('click',resetGame);playAgain.addEventListener('click',resetGame);
  function buildRain(){
    const rain=document.getElementById('starRain');rain.innerHTML='';for(let i=0;i<28;i++){const s=document.createElement('i');s.className='rain-star';s.style.left=(Math.random()*100)+'%';s.style.setProperty('--dur',(3.8+Math.random()*3.5)+'s');s.style.setProperty('--delay',(-Math.random()*6)+'s');s.style.setProperty('--drift',((-45+Math.random()*90))+'px');s.style.transform=`scale(${.55+Math.random()*1.1})`;rain.appendChild(s)}
  }
  function showReward(){reward.classList.add('show');buildRain();playCorrect();setTimeout(playCorrect,260)}
  function resetGame(){
    reward.classList.remove('show');taskIndex=0;totalStars=0;solvedInTask=0;selected=null;transitioning=false;instructionDismissed=false;instruction.classList.remove('hide');renderTask();
  }
  window.addEventListener('resize',()=>{if(touchDrag){touchDrag.ghost.remove();touchDrag=null}});
  renderTask();
})();
</script>
</body>
</html>
