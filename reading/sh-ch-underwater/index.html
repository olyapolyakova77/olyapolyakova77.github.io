  .scene::after{
    content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(5,67,130,.03) 72%,rgba(2,47,91,.18));pointer-events:none;
  }
  .rays{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen;opacity:.26}
  .ray{position:absolute;top:-12%;width:4.5%;height:88%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(12px);transform:rotate(8deg);animation:raySway 8s ease-in-out infinite alternate}
  .ray:nth-child(1){left:20%;animation-delay:-2s}.ray:nth-child(2){left:47%;width:3.2%;animation-delay:-5s}.ray:nth-child(3){left:70%;width:5%;animation-delay:-1s}
  @keyframes raySway{to{transform:translateX(18px) rotate(5deg);opacity:.55}}
  .bubbleLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .bubble{position:absolute;bottom:-9%;border:1.5px solid rgba(218,246,255,.7);border-radius:50%;box-shadow:inset 2px 2px 5px rgba(255,255,255,.5),0 0 8px rgba(123,222,255,.35);animation:rise linear infinite;opacity:.55}
  @keyframes rise{0%{transform:translateY(0) scale(.85);opacity:0}12%{opacity:.58}100%{transform:translateY(-730%) translateX(18px) scale(1.08);opacity:0}}

  .hud{position:absolute;left:1.3%;right:1.3%;top:1.2%;height:7.6%;z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:1%;}
  .hudLeft,.hudRight{display:flex;gap:.55vw;align-items:center;pointer-events:auto}
  .pill,.hudBtn{
    border:1px solid rgba(255,255,255,.64);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(224,243,255,.86));
    color:var(--ink);box-shadow:0 5px 14px rgba(2,27,68,.24),inset 0 1px 0 rgba(255,255,255,.95);
    border-radius:999px;font-weight:800;white-space:nowrap;
  }
  .pill{font-size:clamp(11px,1.15vw,18px);padding:.42em .78em;line-height:1}
  .titlePill{letter-spacing:.04em;background:linear-gradient(180deg,#fff8ff,#e8f5ff)}
  .hudBtn{font:inherit;font-size:clamp(10px,.95vw,15px);padding:.48em .72em;cursor:pointer;outline:none;transition:transform .18s ease,box-shadow .18s ease}
  .hudBtn:hover,.hudBtn:focus-visible{transform:translateY(-1px);box-shadow:0 7px 18px rgba(2,27,68,.3),0 0 0 3px rgba(255,255,255,.2)}
  .hudBtn:active{transform:translateY(1px) scale(.97)}

  .dropZone{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;position:absolute;z-index:8;top:17.1%;height:47.4%;border-radius:44% 44% 35% 35%;pointer-events:auto;cursor:pointer;transition:filter .18s ease,box-shadow .18s ease,transform .18s ease;outline:none}
  .dropZone.sh{left:10.5%;width:38.6%}
  .dropZone.ch{left:50.4%;width:38.4%}
  .dropZone.ready{box-shadow:inset 0 0 0 4px rgba(255,255,255,.13)}
  .dropZone.hover{filter:brightness(1.14) saturate(1.08);box-shadow:inset 0 0 0 5px rgba(255,255,255,.32),0 0 34px rgba(255,244,183,.5);transform:scale(1.012)}
  .dropZone.correct{animation:zoneBounce .55s cubic-bezier(.2,.86,.3,1.2)}
  .dropZone.wrong{animation:zoneShake .35s ease}
  @keyframes zoneBounce{0%,100%{transform:scale(1)}45%{transform:scale(1.035)}}
  @keyframes zoneShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}55%{transform:translateX(7px)}75%{transform:translateX(-3px)}}

    background:
      radial-gradient(ellipse at 14% 18%,rgba(117,226,255,.22) 0 8%,transparent 26%),
      radial-gradient(ellipse at 84% 14%,rgba(203,135,255,.18) 0 8%,transparent 28%),
      linear-gradient(180deg,#0b5489 0%,#074477 40%,#053764 100%);
    border-top:2px solid rgba(211,245,255,.38);
    box-shadow:0 -12px 28px rgba(0,28,67,.26),inset 0 16px 26px rgba(93,210,255,.08);
    /* Keep dragged cards visible while they travel from the shelf into a shell.
       The outer .stage still clips anything outside the game, so a card cannot be lost. */
    overflow:visible;
  }
  .shelf::before{content:"";position:absolute;left:-3%;right:-3%;top:-7%;height:20%;background:radial-gradient(ellipse at center,rgba(106,218,255,.4),transparent 68%);filter:blur(12px);opacity:.55}
  .shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:radial-gradient(ellipse at 50% 100%,rgba(39,112,151,.72),transparent 70%);pointer-events:none}
  .cardsGrid{position:absolute;z-index:4;inset:7.5% 5.2% 5.8%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8% 3.9%;align-items:stretch}
  /* Each word owns a permanent grid slot for the whole round.
     When a solved card disappears, its slot stays in place so the other cards never jump/reflow. */
  .cardSlot{position:relative;min-width:0;min-height:0}
  .card{
    position:absolute;inset:0;display:grid;place-items:center;min-width:0;touch-action:none;cursor:grab;
    border-radius:999px;padding:.14em .35em;color:var(--ink);
    background:radial-gradient(circle at 34% 24%,#fff 0 8%,#fbf7ff 25%,#e9eeff 56%,#dfe8ff 78%,#c6dfff 100%);
    border:3px solid rgba(255,255,255,.83);
    box-shadow:0 7px 0 rgba(2,35,83,.2),0 10px 18px rgba(0,18,57,.28),inset 0 0 0 2px rgba(179,207,255,.68),inset 0 -12px 20px rgba(155,194,255,.22);
    font-weight:800;font-size:clamp(20px,3.15vw,52px);line-height:.9;letter-spacing:-.025em;
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,opacity .16s ease;
    will-change:transform;
  }
  .card::before{content:"";position:absolute;left:11%;right:11%;top:8%;height:22%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,0));opacity:.7;pointer-events:none}
  .card span{position:relative;z-index:2;max-width:94%;overflow:hidden;text-overflow:clip;white-space:nowrap;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .card:hover{transform:translateY(-2px) scale(1.018);box-shadow:0 8px 0 rgba(2,35,83,.18),0 14px 24px rgba(0,18,57,.28),inset 0 0 0 2px rgba(179,207,255,.75)}
  .card.selected{transform:translateY(-4px) scale(1.045);filter:brightness(1.06);box-shadow:0 8px 0 rgba(2,35,83,.16),0 16px 30px rgba(0,18,57,.32),0 0 0 4px rgba(255,222,129,.72),0 0 24px rgba(255,218,115,.5),inset 0 0 0 2px rgba(255,255,255,.9)}
  .card.dragging{cursor:grabbing;z-index:100;transition:none;filter:brightness(1.06);box-shadow:0 20px 34px rgba(0,14,48,.38),0 0 0 4px rgba(255,255,255,.35),inset 0 0 0 2px rgba(179,207,255,.72)}
  .card.snap{transition:transform .24s cubic-bezier(.2,.8,.3,1)}
  .card.shake{animation:cardShake .34s ease}
  @keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}

  .startPanel{position:absolute;inset:0;z-index:30;display:grid;align-items:end;pointer-events:none}
  .startBottom{height:35.55%;display:grid;place-items:center;pointer-events:auto}
  .playBtn,.againBtn{
    border:0;border-radius:999px;padding:.62em 1.55em;font-family:inherit;font-weight:800;font-size:clamp(24px,3.5vw,52px);color:#06275F;cursor:pointer;
    background:linear-gradient(180deg,#fffef8 0%,#ffefbd 58%,#ffd36f 100%);box-shadow:0 8px 0 #c58e2b,0 15px 28px rgba(0,20,58,.38),inset 0 2px 0 rgba(255,255,255,.95);
    transition:transform .16s ease,filter .16s ease;
  }
  .playBtn:hover,.againBtn:hover{transform:translateY(-2px) scale(1.025);filter:brightness(1.03)}
  .playBtn:active,.againBtn:active{transform:translateY(4px);box-shadow:0 4px 0 #c58e2b,0 9px 18px rgba(0,20,58,.3)}
  .hidden{display:none!important}

  .toast{position:absolute;z-index:60;left:50%;top:58.4%;transform:translate(-50%,-50%) scale(.82);opacity:0;pointer-events:none;padding:.34em .82em;border-radius:999px;font-weight:800;font-size:clamp(18px,2.25vw,36px);color:#06275F;background:rgba(255,255,255,.96);border:2px solid rgba(255,255,255,.98);box-shadow:0 9px 24px rgba(0,22,60,.28),0 0 0 0 rgba(255,231,122,0);transition:opacity .15s ease,transform .18s cubic-bezier(.2,.86,.3,1.2),box-shadow .2s ease}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.good{background:linear-gradient(180deg,#fff,#fff3bc);box-shadow:0 9px 24px rgba(0,22,60,.28),0 0 34px rgba(255,225,106,.56)}
  .toast.bad{background:linear-gradient(180deg,#fff,#ffe9f1);box-shadow:0 9px 24px rgba(0,22,60,.26),0 0 24px rgba(255,183,214,.38)}

  .magicDot,.magicGlint,.pearlPulse,.wandFlash{position:fixed;z-index:72;pointer-events:none;will-change:transform,opacity}
  .magicDot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0 20%,#fff5a8 38%,#7feaff 72%,rgba(83,211,255,.05) 100%);box-shadow:0 0 9px rgba(255,245,164,.95),0 0 17px rgba(108,224,255,.62)}
  .magicGlint{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#fff,#ffe786);box-shadow:0 0 9px #fff,0 0 17px rgba(255,219,91,.9)}
  .pearlPulse{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.98) 0 9%,rgba(255,238,163,.6) 22%,rgba(121,225,255,.25) 48%,rgba(121,225,255,0) 72%);filter:blur(.2px)}
  .wandFlash{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#fff6b8 20%,rgba(181,139,255,.56) 46%,rgba(181,139,255,0) 72%);box-shadow:0 0 18px rgba(255,255,255,.75)}

  .flyingCard{position:fixed;z-index:9999;display:grid;place-items:center;border-radius:999px;color:var(--ink);background:radial-gradient(circle at 34% 24%,#fff 0 8%,#fbf7ff 25%,#e9eeff 58%,#cfe3ff 100%);border:3px solid rgba(255,255,255,.9);box-shadow:0 16px 32px rgba(0,16,54,.32),inset 0 0 0 2px rgba(178,205,255,.7);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-weight:800;line-height:1;pointer-events:none;white-space:nowrap}
  .rewardStar{position:fixed;z-index:10000;width:34px;height:34px;display:grid;place-items:center;color:#fff2a3;font:800 29px/1 Arial,sans-serif;text-shadow:0 0 8px #fff,0 0 14px #ffc43d;pointer-events:none}

  .finalScreen{position:absolute;inset:0;z-index:90;background:radial-gradient(circle at 50% 40%,rgba(18,118,171,.18),rgba(1,32,86,.5) 48%,rgba(2,24,68,.78));backdrop-filter:blur(2px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.6%;overflow:hidden}
  .finalCard{position:relative;width:min(60%,620px);height:min(77%,760px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.9%;border-radius:10%;background:radial-gradient(circle at 50% 23%,rgba(255,255,255,.97),rgba(222,244,255,.94) 49%,rgba(175,218,255,.92));border:2px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(0,13,58,.45),inset 0 2px 0 rgba(255,255,255,.95),0 0 36px rgba(126,220,255,.26);padding:3.4% 4.5% 4%;overflow:visible}
  .finalCard::before,.finalCard::after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.9) 0 12%,rgba(168,229,255,.38) 20%,rgba(168,229,255,0) 68%);animation:rewardGlow 2.4s ease-in-out infinite}
  .finalCard::before{width:22%;aspect-ratio:1;left:-7%;top:15%}.finalCard::after{width:16%;aspect-ratio:1;right:-5%;bottom:18%;animation-delay:-1.1s}
  @keyframes rewardGlow{0%,100%{transform:scale(.85);opacity:.45}50%{transform:scale(1.18);opacity:1}}
  .speech{position:relative;z-index:3;background:#fff;border-radius:999px;color:#06275F;font-weight:800;font-size:clamp(27px,4.45vw,64px);padding:.27em .7em;box-shadow:0 8px 20px rgba(0,25,64,.2),0 0 24px rgba(255,255,255,.48);animation:speechPop 2.2s ease-in-out infinite}
  .speech::after{content:"";position:absolute;left:48%;bottom:-13%;width:9%;height:25%;background:#fff;clip-path:polygon(0 0,100% 0,28% 100%)}
  @keyframes speechPop{0%,78%,100%{transform:scale(1)}84%{transform:scale(1.035)}}
  .petWrap{position:relative;z-index:2;width:min(56%,360px);aspect-ratio:278/332;overflow:visible;border:0;animation:petBounce 1.72s ease-in-out infinite;transform-origin:50% 78%;filter:drop-shadow(0 18px 18px rgba(0,38,91,.26)) drop-shadow(0 0 18px rgba(151,232,255,.34))}
  .petWrap img{width:100%;height:100%;object-fit:contain;display:block}
  .petWrap::after{content:"";position:absolute;right:0.5%;top:28.5%;width:15%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 33%,#fff 0 12%,#fffbd1 21%,#d9c2ff 42%,rgba(117,224,255,.46) 58%,rgba(117,224,255,0) 74%);box-shadow:0 0 15px rgba(255,255,255,.92),0 0 28px rgba(172,139,255,.68);animation:wandOrb 1.45s ease-in-out infinite;pointer-events:none}
  @keyframes wandOrb{0%,100%{transform:scale(.82);opacity:.72}50%{transform:scale(1.14);opacity:1}}
  @keyframes petBounce{0%,100%{transform:translateY(0) rotate(-1.5deg)}42%{transform:translateY(-5.3%) rotate(1.7deg)}57%{transform:translateY(-2.6%) rotate(.45deg)}76%{transform:translateY(-.8%) rotate(-.8deg)}}
  .againBtn{font-size:clamp(18px,2.5vw,36px);padding:.52em 1.32em;position:relative;z-index:3}
  .rainStar{position:absolute;top:-12%;color:#ffe98b;text-shadow:0 0 8px #fff,0 0 15px #ffd25a;font:900 clamp(13px,1.8vw,28px)/1 Arial,sans-serif;animation:starRain linear infinite;opacity:.9;pointer-events:none}
  @keyframes starRain{0%{transform:translateY(-12vh) rotate(0) scale(.65);opacity:0}10%{opacity:.9}100%{transform:translateY(118vh) rotate(280deg) scale(1.1);opacity:.18}}

  @media (max-aspect-ratio:4/3){
    .card{font-size:clamp(18px,4.05vw,48px)}
    .pill{font-size:clamp(10px,1.7vw,17px)}
    .hudBtn{font-size:clamp(9px,1.35vw,14px)}
  }
  @media (max-height:560px){
    .cardsGrid{inset:6.8% 5% 5.2%;gap:6% 3.6%}
    .card{border-width:2px}
    .hud{top:.8%}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>

</main>
<script>
(() => {
  'use strict';
  const rounds = [
    [
      {word:'ship',target:'sh'},{word:'chair',target:'ch'},{word:'shell',target:'sh'},{word:'cheese',target:'ch'},
      {word:'shop',target:'sh'},{word:'chick',target:'ch'},{word:'fish',target:'sh'},{word:'beach',target:'ch'}
    ],
    [
      {word:'sheep',target:'sh'},{word:'chin',target:'ch'},{word:'shoe',target:'sh'},{word:'chip',target:'ch'},
      {word:'shark',target:'sh'},{word:'chat',target:'ch'},{word:'brush',target:'sh'},{word:'lunch',target:'ch'}
    ],
    [
      {word:'dish',target:'sh'},{word:'rich',target:'ch'},{word:'wish',target:'sh'},{word:'much',target:'ch'},
      {word:'wash',target:'sh'},{word:'peach',target:'ch'},{word:'short',target:'sh'},{word:'bench',target:'ch'}
    ]
  ];
  const TOTAL = rounds.reduce((n,r)=>n+r.length,0);
  const stage = document.getElementById('stage');
  const grid = document.getElementById('cardsGrid');
  const zones = [...document.querySelectorAll('.dropZone')];
  const taskPill = document.getElementById('taskPill');
  const starPill = document.getElementById('starPill');
  const toast = document.getElementById('toast');
  const startPanel = document.getElementById('startPanel');
  const finalScreen = document.getElementById('finalScreen');
  const playBtn = document.getElementById('playBtn');
  const againBtn = document.getElementById('againBtn');
  const soundBtn = document.getElementById('soundBtn');
  const restartBtn = document.getElementById('restartBtn');
  let roundIndex = 0, stars = 0, solved = 0, selected = null, started = false, audioOn = true;
  let audioCtx = null, toastTimer = null, moving = false;

  function makeBubbles(){
    const layer = document.getElementById('bubbleLayer');
    layer.innerHTML='';
    const specs = [
      [8,13,8.5,0],[17,9,10.5,3.1],[31,12,9.2,1.7],[43,7,11.8,5.2],[58,10,8.9,2.5],[71,8,10.8,.9],[83,14,12.2,4.4],[93,9,9.7,2.1]
    ];
    specs.forEach(([left,size,dur,delay])=>{
      const b=document.createElement('i');b.className='bubble';b.style.left=left+'%';b.style.width=b.style.height=size+'px';b.style.animationDuration=dur+'s';b.style.animationDelay='-'+delay+'s';layer.appendChild(b);
    });
  }

  function ensureAudio(){
    if(!audioOn) return null;
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function tone(kind){
    const ctx=ensureAudio(); if(!ctx) return;
    const now=ctx.currentTime;
    const notes = kind==='good' ? [659.25,783.99,987.77] : [246.94,196.00];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=kind==='good'?'sine':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(kind==='good'?.085:.06,now+i*.07+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.16);
      o.connect(g).connect(ctx.destination);o.start(now+i*.07);o.stop(now+i*.07+.18);
    });
  }

  function showToast(text,type){
    clearTimeout(toastTimer);toast.textContent=text;toast.className='toast '+type+' show';
    toastTimer=setTimeout(()=>toast.className='toast',560);
  }

  function updateHud(){
    taskPill.textContent=`Task ${Math.min(roundIndex+1,3)}/3`;
    starPill.textContent=`★ ${stars}/${TOTAL}`;
  }

  function shuffle(items){
    const a=[...items];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }

  function renderRound(){
    moving=false;selected=null;solved=0;grid.innerHTML='';zones.forEach(z=>z.classList.remove('ready','hover','correct','wrong'));
    shuffle(rounds[roundIndex]).forEach((item)=>{
      const slot=document.createElement('div');slot.className='cardSlot';
      const card=document.createElement('div');card.className='card';card.dataset.target=item.target;card.dataset.word=item.word;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',item.word);
      const span=document.createElement('span');span.textContent=item.word;card.appendChild(span);
      bindCard(card);slot.appendChild(card);grid.appendChild(slot);
    });
    updateHud();
  }

  function clearSelection(){
    if(selected) selected.classList.remove('selected');selected=null;zones.forEach(z=>z.classList.remove('ready'));
  }
  function selectCard(card){
    if(!started || moving || !card.isConnected) return;
    if(selected===card){clearSelection();return;}
    if(selected) selected.classList.remove('selected');
    selected=card;card.classList.add('selected');zones.forEach(z=>z.classList.add('ready'));
  }

  function zoneAtPoint(x,y){
    const stack=document.elementsFromPoint(x,y);
    for(const el of stack){
      const z=el.closest?el.closest('.dropZone'):null;
      if(z) return z;
    }
    return null;
  }

  function bindCard(card){
    let startX=0,startY=0,dx=0,dy=0,dragging=false,pointerId=null;
    const threshold=7;
    card.addEventListener('pointerdown',e=>{
      if(!started||moving||e.button>0) return;
      pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;dx=dy=0;dragging=false;
      card.setPointerCapture?.(pointerId);
    });
    card.addEventListener('pointermove',e=>{
      if(pointerId!==e.pointerId||!card.hasPointerCapture?.(pointerId)) return;
      dx=e.clientX-startX;dy=e.clientY-startY;
      if(!dragging && Math.hypot(dx,dy)>=threshold){
        dragging=true;clearSelection();card.classList.add('dragging');
      }
      if(dragging){
        card.style.transform=`translate(${dx}px,${dy}px) scale(1.065)`;
        const z=zoneAtPoint(e.clientX,e.clientY);
        zones.forEach(zone=>zone.classList.toggle('hover',zone===z));
      }
    });
    const end=e=>{
      if(pointerId!==e.pointerId) return;
      try{card.releasePointerCapture?.(pointerId)}catch(_){ }
      pointerId=null;zones.forEach(z=>z.classList.remove('hover'));
      if(!dragging) return;
      card.dataset.suppressClick=String(performance.now()+250);
      const zone=zoneAtPoint(e.clientX,e.clientY);
      card.classList.remove('dragging');
      if(zone){attempt(card,zone.dataset.zone,true);} else {snapBack(card);}
    };
    card.addEventListener('pointerup',end);card.addEventListener('pointercancel',e=>{if(pointerId===e.pointerId){pointerId=null;zones.forEach(z=>z.classList.remove('hover'));card.classList.remove('dragging');snapBack(card)}});
    card.addEventListener('click',()=>{
      const until=Number(card.dataset.suppressClick||0);if(performance.now()<until) return;selectCard(card);
    });
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCard(card)}});
  }

  function snapBack(card,wrong=false){
    card.classList.add('snap');card.style.transform='translate(0,0)';
    setTimeout(()=>{card.classList.remove('snap');card.style.transform='';if(wrong){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),380)}},250);
  }

  zones.forEach(zone=>{
    zone.addEventListener('click',()=>{if(selected && !moving) attempt(selected,zone.dataset.zone,false)});
    zone.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selected){e.preventDefault();attempt(selected,zone.dataset.zone,false)}});
  });

  function burstAt(x,y,soft=false){
    const count=soft?7:14;
    for(let i=0;i<count;i++){
      const p=document.createElement('i');
      p.className=(i%3===0?'magicGlint':'magicDot');
      const s=soft?(5+Math.random()*5):(6+Math.random()*8);
      p.style.width=p.style.height=s+'px';p.style.left=(x-s/2)+'px';p.style.top=(y-s/2)+'px';
      document.body.appendChild(p);
      const ang=(Math.PI*2*i/count)+(Math.random()-.5)*.35,dist=(soft?24:42)+Math.random()*(soft?26:54);
      p.animate([
        {transform:`translate(0,0) scale(.35) rotate(0deg)`,opacity:0},
        {transform:`translate(${Math.cos(ang)*dist*.35}px,${Math.sin(ang)*dist*.35}px) scale(1.1) rotate(45deg)`,opacity:1,offset:.28},
        {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(.15) rotate(130deg)`,opacity:0}
      ],{duration:(soft?420:650)+Math.random()*180,easing:'cubic-bezier(.18,.72,.24,1)',fill:'forwards'}).onfinish=()=>p.remove();
    }
  }

  function pearlMagic(zone){
    const zr=zone.getBoundingClientRect();
    const x=zr.left+zr.width/2,y=zr.top+zr.height*.72;
    const pulse=document.createElement('i');pulse.className='pearlPulse';pulse.style.left=(x-22)+'px';pulse.style.top=(y-22)+'px';document.body.appendChild(pulse);
    pulse.animate([{transform:'scale(.25)',opacity:0},{transform:'scale(1.15)',opacity:1,offset:.35},{transform:'scale(2.35)',opacity:0}],{duration:640,easing:'ease-out',fill:'forwards'}).onfinish=()=>pulse.remove();
    burstAt(x,y,false);
    const sr=stage.getBoundingClientRect();
    const wandX=sr.left+sr.width*.548,wandY=sr.top+sr.height*.164;
    const w=document.createElement('i');w.className='wandFlash';w.style.left=(wandX-17)+'px';w.style.top=(wandY-17)+'px';document.body.appendChild(w);
    w.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1.25)',opacity:1,offset:.3},{transform:'scale(2)',opacity:0}],{duration:520,easing:'ease-out',fill:'forwards'}).onfinish=()=>w.remove();
    burstAt(wandX,wandY,true);
  }

  function attempt(card,zoneKey,fromDrag){
    if(!card||moving||!card.isConnected) return;
    if(card.dataset.target===zoneKey){
      clearSelection();correct(card,document.querySelector(`.dropZone.${zoneKey}`));
    }else{
      clearSelection();tone('bad');showToast('Oops!','bad');
      const z=document.querySelector(`.dropZone.${zoneKey}`);z.classList.remove('wrong');void z.offsetWidth;z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),380);
      const zr=z.getBoundingClientRect();burstAt(zr.left+zr.width/2,zr.top+zr.height*.72,true);
      snapBack(card,true);
    }
  }

  function correct(card,zone){
    moving=true;
    const r=card.getBoundingClientRect(), zr=zone.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='flyingCard';fly.textContent=card.dataset.word;fly.style.left=r.left+'px';fly.style.top=r.top+'px';fly.style.width=r.width+'px';fly.style.height=r.height+'px';fly.style.fontSize=getComputedStyle(card).fontSize;document.body.appendChild(fly);
    card.style.visibility='hidden';card.style.transform='';
    const tx=(zr.left+zr.width/2)-(r.left+r.width/2);const ty=(zr.top+zr.height*.68)-(r.top+r.height/2);
    fly.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${tx*.72}px,${ty*.72}px) scale(.76)`,opacity:1,offset:.72},
      {transform:`translate(${tx}px,${ty}px) scale(.24)`,opacity:.08}
    ],{duration:560,easing:'cubic-bezier(.22,.78,.23,1)',fill:'forwards'}).onfinish=()=>{fly.remove();card.remove()};
    zone.classList.remove('correct');void zone.offsetWidth;zone.classList.add('correct');setTimeout(()=>zone.classList.remove('correct'),620);
    pearlMagic(zone);
    setTimeout(()=>{stars++;solved++;updateHud();tone('good');showToast(['Great!','Well done!','Yes!'][stars%3],'good');flyStar(zone);moving=false;if(solved===rounds[roundIndex].length) setTimeout(nextRound,760)},420);
  }

  function flyStar(zone){
    const zr=zone.getBoundingClientRect(), sr=starPill.getBoundingClientRect();
    const el=document.createElement('div');el.className='rewardStar';el.textContent='★';el.style.left=(zr.left+zr.width/2-17)+'px';el.style.top=(zr.top+zr.height*.69-17)+'px';document.body.appendChild(el);
    const tx=(sr.left+sr.width/2)-(zr.left+zr.width/2), ty=(sr.top+sr.height/2)-(zr.top+zr.height*.69);
    const anim=el.animate([{transform:'translate(0,0) scale(.65)',opacity:0},{transform:'translate(0,-18px) scale(1.25)',opacity:1,offset:.22},{transform:`translate(${tx}px,${ty}px) scale(.55)`,opacity:.9}],{duration:690,easing:'cubic-bezier(.25,.7,.25,1)',fill:'forwards'});
    anim.onfinish=()=>el.remove();
  }

  function nextRound(){
    if(roundIndex<rounds.length-1){
      roundIndex++;grid.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:340,easing:'ease-out'});renderRound();
    }else showFinal();
  }

  function addStarRain(){
    finalScreen.querySelectorAll('.rainStar').forEach(s=>s.remove());
    for(let i=0;i<34;i++){
      const s=document.createElement('i');s.className='rainStar';s.textContent='★';s.style.left=(2+Math.random()*96)+'%';s.style.animationDuration=(3.8+Math.random()*3.6)+'s';s.style.animationDelay=(-Math.random()*5.6)+'s';s.style.fontSize=(12+Math.random()*18)+'px';finalScreen.appendChild(s);
    }
  }
  function showFinal(){
    moving=false;clearSelection();grid.innerHTML='';addStarRain();finalScreen.classList.remove('hidden');
    const card=finalScreen.querySelector('.finalCard');
    card.animate([{transform:'translateY(28px) scale(.92)',opacity:0},{transform:'translateY(-5px) scale(1.015)',opacity:1,offset:.72},{transform:'translateY(0) scale(1)',opacity:1}],{duration:620,easing:'cubic-bezier(.18,.78,.2,1)',fill:'both'});
    tone('good');
  }

  function resetGame(autoStart=false){
    roundIndex=0;stars=0;solved=0;moving=false;clearSelection();finalScreen.classList.add('hidden');updateHud();
    started=autoStart;startPanel.classList.toggle('hidden',autoStart);
    if(autoStart) renderRound(); else grid.innerHTML='';
  }

  playBtn.addEventListener('click',()=>{ensureAudio();started=true;startPanel.classList.add('hidden');renderRound()});
  againBtn.addEventListener('click',()=>{ensureAudio();resetGame(true)});
  restartBtn.addEventListener('click',()=>{ensureAudio();resetGame(true)});
  soundBtn.addEventListener('click',()=>{audioOn=!audioOn;soundBtn.textContent=audioOn?'Sound':'Muted';soundBtn.setAttribute('aria-pressed',String(audioOn));if(audioOn) tone('good')});

  makeBubbles();updateHud();
  window.__GAME_TEST__={
    state:()=>({roundIndex,stars,solved,started,cards:grid.querySelectorAll('.card').length,slots:grid.querySelectorAll('.cardSlot').length,final:!finalScreen.classList.contains('hidden')}),
    solveCurrent:()=>{[...grid.children].forEach((c,i)=>setTimeout(()=>{if(c.isConnected){const z=document.querySelector('.dropZone.'+c.dataset.target);correct(c,z)}},i*760))}
  };
})();
</script>
</body>
</html>
