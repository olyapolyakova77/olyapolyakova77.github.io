<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Long I / Short I Sorter</title>
<style>
:root{--ink:#102b79;--blue:#2467d8;--blue2:#174eaf;--violet:#9857d7;--violet2:#6d36ae;--cream:#fffaf0;--gold:#e9cf82;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#54b9ed}
body{font-family:"Trebuchet MS",Verdana,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:#54b9ed}
#stage{position:absolute;width:1600px;height:900px;transform-origin:top left;overflow:hidden;background:#65c2ee}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;filter:contrast(1.025) saturate(1.02)}
/* Sky masks hide the baked-in page-1 UI wherever dynamic UI replaces it. */
.skyMask{position:absolute;z-index:4;pointer-events:none;background:linear-gradient(180deg,#24a9ef 0%,#72c9ef 100%)}
#instructionMask{left:305px;top:0;width:910px;height:194px;display:none;mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%)}
#progressMask{display:none}
#instruction{display:none!important;position:absolute;z-index:12;left:360px;top:24px;width:780px;min-height:138px;padding:20px 38px;border-radius:42px;background:rgba(255,255,255,.97);box-shadow:0 10px 22px rgba(34,64,124,.18);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font:800 39px/1.08 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.2px}
#instruction::before{content:"";position:absolute;left:-36px;top:61px;width:50px;height:39px;background:white;clip-path:polygon(100% 0,0 50%,100% 100%)}
#progress{position:absolute;z-index:13;right:60px;top:24px;width:170px;height:70px;border-radius:36px;background:#fffaf0;display:flex;align-items:center;justify-content:center;color:var(--ink);font:900 31px/1 Verdana,sans-serif;border:3px solid rgba(221,202,146,.9);box-shadow:0 8px 18px rgba(28,60,116,.18)}
.label{display:none!important}
#longLabel{left:345px;top:414px;width:260px;height:60px;color:#153f9d}
#shortLabel{left:918px;top:414px;width:268px;height:60px;color:#6b34a8}
.label .name{font:900 36px/1 "Arial Rounded MT Bold","Comic Sans MS","Trebuchet MS",Verdana,sans-serif;letter-spacing:-.4px}
.label .ipa{font:900 32px/1 "Arial Rounded MT Bold","Comic Sans MS","Trebuchet MS",Verdana,sans-serif;letter-spacing:-.2px}
.drop{position:absolute;z-index:20;border-radius:42px;background:transparent;transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
#dropLong{left:250px;top:300px;width:500px;height:350px}
#dropShort{left:850px;top:300px;width:500px;height:350px}
.drop.hot{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 5px rgba(255,255,255,.30),0 0 28px rgba(255,255,255,.36);transform:scale(1.012)}
.drop.choice{cursor:pointer}
#groundShade{position:absolute;left:0;right:0;bottom:0;height:242px;z-index:6;pointer-events:none;background:linear-gradient(180deg,rgba(202,224,133,.97) 0%,rgba(225,219,147,.985) 34%,rgba(244,215,143,.99) 100%);box-shadow:0 -9px 22px rgba(62,94,54,.12),inset 0 2px 0 rgba(255,255,255,.32)}
#groundShade::before{content:"";position:absolute;left:0;right:0;top:-24px;height:26px;background:linear-gradient(180deg,rgba(202,224,133,0) 0%,rgba(202,224,133,.78) 70%,rgba(202,224,133,.97) 100%)}
#groundShade::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 18%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 76% 34%,rgba(255,255,255,.12) 0 1.5px,transparent 2.5px);background-size:54px 54px,46px 46px;opacity:.42}
#cards{position:absolute;inset:0;z-index:35}
.card{position:absolute;width:250px;height:100px;padding:0 12px;border-radius:26px;background:linear-gradient(180deg,#fffefb 0%,#fff9ef 100%);border:3px solid #1d5fd6;box-shadow:0 4px 0 #e4c45e,0 11px 22px rgba(24,50,101,.18),inset 0 2px 0 rgba(255,255,255,.98),inset 0 -4px 8px rgba(227,200,125,.16);display:flex;align-items:center;justify-content:center;color:var(--ink);font:900 60px/1 "Arial Rounded MT Bold","Comic Sans MS","Trebuchet MS",Verdana,sans-serif;letter-spacing:-.8px;cursor:grab;touch-action:none;transform-origin:center;transition:opacity .2s ease,transform .16s ease,box-shadow .16s ease,left .24s ease,top .24s ease;will-change:left,top,transform;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.card.appear{opacity:0;transform:translateY(26px) scale(.96)}
.card.ready{opacity:1;transform:translateY(0) scale(1)}
.card:hover{transform:translateY(-2px) scale(1.01)}
.card.dragging{z-index:100!important;cursor:grabbing;transition:none!important;transform:scale(1.035);box-shadow:0 18px 30px rgba(19,43,90,.28),inset 0 2px 0 rgba(255,255,255,.95)}
.card.selected{transform:translateY(-4px) scale(1.035);box-shadow:0 0 0 6px rgba(83,153,255,.26),0 14px 28px rgba(19,43,90,.24),inset 0 2px 0 rgba(255,255,255,.98)}
.card.wrong{animation:shake .34s ease}
.card.absorb{opacity:0;transform:scale(.24);filter:saturate(1.25)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}

#decorLayer{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.cloud{position:absolute;width:168px;height:58px;background:rgba(255,255,255,.94);border-radius:999px;box-shadow:0 8px 16px rgba(43,81,139,.14);opacity:.96;animation:cloudBob var(--dur) ease-in-out var(--delay) infinite alternate;transform:scale(var(--s))}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:78px;height:78px;left:20px;top:-34px}
.cloud::after{width:92px;height:92px;right:16px;top:-42px}
.cloud.c1{left:145px;top:96px}
.cloud.c2{left:1182px;top:118px}
@keyframes cloudBob{from{transform:translateX(0) translateY(0) scale(var(--s))}to{transform:translateX(var(--dx)) translateY(5px) scale(var(--s))}}
.sunOrb{position:absolute;left:1238px;top:58px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7be 0 18%,#ffe680 34%,#ffd148 61%,#ffb52f 80%,rgba(255,181,47,.82) 100%);box-shadow:0 0 28px rgba(255,198,78,.46),0 0 54px rgba(255,218,126,.28);animation:sunPulse 4s ease-in-out infinite}
.sunOrb::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,219,121,.34) 0 9deg,transparent 9deg 27deg);animation:sunSpin 18s linear infinite;opacity:.75}
.sunOrb::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 34% 34%,rgba(255,255,255,.82) 0 15%,rgba(255,255,255,0) 38%)}
@keyframes sunSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes sunPulse{0%,100%{transform:scale(1);filter:saturate(1)}50%{transform:scale(1.06);filter:saturate(1.06)}}
.ladybug{position:absolute;left:1318px;top:592px;width:36px;height:28px;border-radius:60% 60% 52% 52%;background:linear-gradient(90deg,#ff5b43 0 48%,#d9271e 48% 100%);box-shadow:0 3px 6px rgba(22,35,67,.18);transform-origin:50% 100%;animation:ladybugWiggle 3.6s ease-in-out infinite}
.ladybug::before{content:"";position:absolute;width:16px;height:14px;left:10px;top:-7px;border-radius:50%;background:#222f56}
.ladybug::after{content:"";position:absolute;left:7px;top:6px;width:6px;height:6px;border-radius:50%;background:#1f2441;box-shadow:14px 1px 0 #1f2441,3px 10px 0 #1f2441,17px 11px 0 #1f2441}
@keyframes ladybugWiggle{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
#ambient{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.firefly{position:absolute;width:9px;height:9px;border-radius:50%;background:rgba(255,244,146,.95);box-shadow:0 0 16px 5px rgba(255,227,105,.48);animation:floatGlow var(--d) ease-in-out var(--delay) infinite alternate}
@keyframes floatGlow{from{transform:translate(0,0) scale(.7);opacity:.25}to{transform:translate(var(--x),var(--y)) scale(1.15);opacity:.92}}
#fx{position:absolute;inset:0;z-index:120;pointer-events:none}
.spark{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff7b5 28%,#ffd45e 55%,rgba(255,212,94,0) 75%);animation:spark .68s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.15)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.25)}}
#flash{position:absolute;inset:0;z-index:180;background:rgba(255,255,255,.58);opacity:0;pointer-events:none;transition:opacity .28s ease}
#flash.show{opacity:1}
#final{position:absolute;inset:0;z-index:220;display:none;align-items:center;justify-content:center;background:rgba(19,43,104,.24);backdrop-filter:blur(2px)}
#panel{width:510px;padding:35px 34px;border-radius:36px;background:rgba(255,255,255,.97);box-shadow:0 20px 40px rgba(22,42,88,.28);text-align:center}
#panel h1{margin:0 0 12px;color:var(--ink);font:900 62px/1 "Arial Rounded MT Bold","Trebuchet MS",sans-serif}
#panel p{margin:0 0 24px;color:#3e5da6;font:700 24px/1.25 "Trebuchet MS",sans-serif}
#again{border:0;border-radius:30px;padding:17px 35px;background:linear-gradient(180deg,#3480ff,#1858d9);color:#fff;font:900 28px/1 "Trebuchet MS",sans-serif;box-shadow:0 11px 23px rgba(25,80,178,.28);cursor:pointer}
.conf{position:absolute;top:-30px;width:15px;height:23px;border-radius:4px;animation:fall var(--dur) linear var(--delay) forwards}
@keyframes fall{to{transform:translate(var(--dx),980px) rotate(var(--rot));opacity:.15}}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>

<div id="instructionMask" class="skyMask"></div>
<div id="progressMask" class="skyMask"></div>
<div id="groundShade"></div>
<div id="instruction">Drag each word<br>to the correct house.</div>
<div id="progress">1 / 4</div>
<div id="longLabel" class="label"><span class="name">LONG I</span><span class="ipa">/aɪ/</span></div>
<div id="shortLabel" class="label"><span class="name">SHORT I</span><span class="ipa">/ɪ/</span></div>
<div id="dropLong" class="drop" data-zone="long"></div>
<div id="dropShort" class="drop" data-zone="short"></div>
<div id="ambient"></div>
<div id="decorLayer">
  <span class="cloud c1" style="--s:.86;--dx:22px;--dur:7.8s;--delay:-1.4s"></span>
  <span class="cloud c2" style="--s:1.02;--dx:-18px;--dur:8.8s;--delay:-3.1s"></span>
  <span class="sunOrb"></span>
  <span class="ladybug"></span>
</div>
<div id="cards"></div>
<div id="fx"></div>
<div id="flash"></div>
<div id="final"><div id="panel"><h1>Amazing!</h1><p>You sorted all the words!</p><button id="again" type="button">PLAY AGAIN</button></div></div>
</div></div>
<script>
'use strict';
(()=>{
const W=1600,H=900,CW=250,CH=100;
const PAGES=[{"long": ["kite", "five", "bike", "line"], "short": ["pig", "sit", "fish", "milk"]}, {"long": ["time", "nine", "ride", "hide"], "short": ["big", "six", "win", "lip"]}, {"long": ["like", "fine", "dive", "mice"], "short": ["pin", "hill", "swim", "gift"]}, {"long": ["smile", "white", "drive", "slide"], "short": ["kick", "ring", "ship", "list"]}];
const BUTTERFLIES=[];
const el={viewport:document.getElementById('viewport'),stage:document.getElementById('stage'),cards:document.getElementById('cards'),instruction:document.getElementById('instruction'),instructionMask:document.getElementById('instructionMask'),progress:document.getElementById('progress'),dropLong:document.getElementById('dropLong'),dropShort:document.getElementById('dropShort'),ambient:document.getElementById('ambient'),fx:document.getElementById('fx'),flash:document.getElementById('flash'),final:document.getElementById('final'),again:document.getElementById('again')};
const zone={long:{x:250,y:300,w:500,h:350},short:{x:850,y:300,w:500,h:350}};
const state={page:0,scale:1,left:0,top:0,drag:null,selected:null,done:0,transition:false,complete:false};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fit(){const vw=el.viewport.clientWidth,vh=el.viewport.clientHeight,s=Math.max(vw/W,vh/H);state.scale=s;state.left=(vw-W*s)/2;state.top=(vh-H*s)/2;el.stage.style.transform=`translate(${state.left}px,${state.top}px) scale(${s})`}
function local(cx,cy){return{x:(cx-state.left)/state.scale,y:(cy-state.top)/state.scale}}
function pos(node,x,y){node.style.left=x+'px';node.style.top=y+'px'}
function homes(){const gap=24,start=Math.round((W-(CW*4+gap*3))/2),xs=[0,1,2,3].map(i=>start+i*(CW+gap));return [...xs.map(x=>({x,y:670})),...xs.map(x=>({x,y:782}))]}
function progress(){el.progress.textContent=(state.page+1)+' / 4'}
function instruction(){el.instruction.style.display='none';el.instructionMask.style.display='none'}
function highlight(z){el.dropLong.classList.toggle('hot',z==='long');el.dropShort.classList.toggle('hot',z==='short')}
function clearSelection(){if(state.selected){state.selected.classList.remove('selected');state.selected=null}el.dropLong.classList.remove('choice');el.dropShort.classList.remove('choice')}
function selectCard(c){if(state.transition||state.complete||c.dataset.placed==='1')return;if(state.selected===c){clearSelection();return}clearSelection();state.selected=c;c.classList.add('selected');el.dropLong.classList.add('choice');el.dropShort.classList.add('choice');grabSound()}
function chooseHouse(z){if(!state.selected||state.transition||state.complete)return;const c=state.selected;if(c.dataset.zone===z){clearSelection();accept(c,z)}else{c.classList.add('wrong');wrongSound();setTimeout(()=>c.classList.remove('wrong'),360)}}

function buildAmbient(){
  el.ambient.innerHTML='';
  if(state.page===3){
    for(let i=0;i<11;i++){
      const f=document.createElement('span');
      f.className='firefly';
      f.style.left=(130+Math.random()*1320)+'px';
      f.style.top=(215+Math.random()*410)+'px';
      f.style.setProperty('--d',(2.2+Math.random()*2.5)+'s');
      f.style.setProperty('--delay',(-Math.random()*3)+'s');
      f.style.setProperty('--x',(-20+Math.random()*40)+'px');
      f.style.setProperty('--y',(-35+Math.random()*70)+'px');
      el.ambient.appendChild(f);
    }
  }
}

function buildCards(){clearSelection();el.cards.innerHTML='';state.done=0;const p=PAGES[state.page];const items=shuffle([...p.long.map(word=>({word,zone:'long'})),...p.short.map(word=>({word,zone:'short'}))]);const hs=homes();items.forEach((item,i)=>{const c=document.createElement('div');c.className='card appear';c.textContent=item.word;c.dataset.zone=item.zone;c.dataset.placed='0';c.dataset.homeX=hs[i].x;c.dataset.homeY=hs[i].y;const len=item.word.length;const fs=len<=3?70:len===4?62:56;c.style.fontSize=fs+'px';c.style.zIndex=40+i;pos(c,hs[i].x,hs[i].y);c.addEventListener('pointerdown',ev=>start(ev,c));el.cards.appendChild(c);requestAnimationFrame(()=>setTimeout(()=>{c.classList.remove('appear');c.classList.add('ready')},55*i))})}
function render(){progress();instruction();buildAmbient();buildCards()}

function start(e,c){
  if(state.transition||state.complete||c.dataset.placed==='1')return;
  e.preventDefault();resume();
  const p=local(e.clientX,e.clientY),x=parseFloat(c.style.left),y=parseFloat(c.style.top);
  state.drag={c,id:e.pointerId,ox:p.x-x,oy:p.y-y,startX:p.x,startY:p.y,hover:null,moved:false};
  c.classList.remove('wrong');
  try{c.setPointerCapture?.(e.pointerId)}catch(_e){}
}
function inZone(x,y,z){const a=zone[z];return x>=a.x&&x<=a.x+a.w&&y>=a.y&&y<=a.y+a.h}
function move(e){
  const d=state.drag;if(!d||e.pointerId!==d.id)return;e.preventDefault();
  const p=local(e.clientX,e.clientY);
  if(!d.moved){
    const dist=Math.hypot(p.x-d.startX,p.y-d.startY);
    if(dist<10)return;
    d.moved=true;clearSelection();d.c.classList.add('dragging');grabSound();
  }
  const x=Math.max(0,Math.min(W-CW,p.x-d.ox)),y=Math.max(0,Math.min(H-CH,p.y-d.oy));
  pos(d.c,x,y);
  const cx=x+CW/2,cy=y+CH/2;
  d.hover=inZone(cx,cy,'long')?'long':inZone(cx,cy,'short')?'short':null;
  highlight(d.hover)
}
function up(e){
  const d=state.drag;if(!d||e.pointerId!==d.id)return;
  if(!d.moved){state.drag=null;selectCard(d.c);return}
  d.c.classList.remove('dragging');highlight(null);
  if(d.hover===d.c.dataset.zone){clearSelection();accept(d.c,d.hover)}else reject(d.c);
  state.drag=null
}
function reject(c){c.classList.add('wrong');c.style.transition='left .28s ease,top .28s ease,transform .18s ease';pos(c,+c.dataset.homeX,+c.dataset.homeY);wrongSound();setTimeout(()=>{c.classList.remove('wrong');c.style.transition=''},360)}
function accept(c,z){c.dataset.placed='1';const a=zone[z],tx=a.x+a.w/2-CW/2,ty=a.y+a.h/2-CH/2;c.style.transition='left .30s cubic-bezier(.2,.75,.2,1),top .30s cubic-bezier(.2,.75,.2,1),opacity .25s ease,transform .25s ease';pos(c,tx,ty);burst(a.x+a.w/2,a.y+a.h/2);rightSound();setTimeout(()=>c.classList.add('absorb'),165);setTimeout(()=>{c.style.visibility='hidden';c.remove()},510);state.done++;if(state.done===8)setTimeout(pageComplete,780)}
function burst(cx,cy,n=14){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';const ang=Math.random()*Math.PI*2,dist=30+Math.random()*65;s.style.left=(cx-9)+'px';s.style.top=(cy-9)+'px';s.style.setProperty('--tx',Math.cos(ang)*dist+'px');s.style.setProperty('--ty',Math.sin(ang)*dist+'px');el.fx.appendChild(s);setTimeout(()=>s.remove(),720)}}
function pageComplete(){if(state.transition)return;if(state.page<3){state.transition=true;burst(800,260,22);el.flash.classList.add('show');setTimeout(()=>{state.page++;render();setTimeout(()=>{el.flash.classList.remove('show');state.transition=false},180)},310)}else showFinal()}
function confetti(){const colors=['#ff6476','#ffd34e','#5fcf74','#57a9ff','#bf78ea','#ff9e4d'];for(let i=0;i<72;i++){const q=document.createElement('span');q.className='conf';q.style.left=(Math.random()*W)+'px';q.style.background=colors[i%colors.length];q.style.setProperty('--dur',(3+Math.random()*1.8)+'s');q.style.setProperty('--delay',(Math.random()*.45)+'s');q.style.setProperty('--dx',(-120+Math.random()*240)+'px');q.style.setProperty('--rot',(-420+Math.random()*840)+'deg');el.fx.appendChild(q);setTimeout(()=>q.remove(),5200)}}
function showFinal(){state.complete=true;burst(800,250,30);confetti();finishSound();el.final.style.display='flex'}
function reset(){state.page=0;state.drag=null;clearSelection();state.done=0;state.transition=false;state.complete=false;el.final.style.display='none';el.fx.innerHTML='';highlight(null);render()}

function audio(){if(!window.__ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;window.__ctx=new A()}return window.__ctx}
function resume(){const a=audio();if(a&&a.state==='suspended')a.resume().catch(()=>{})}
function tone(f,d,v=.024,type='triangle',delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function grabSound(){tone(340,.07,.012)}
function rightSound(){tone(660,.10,.026);tone(880,.15,.026,'triangle',.07)}
function wrongSound(){tone(300,.10,.013,'sine');tone(245,.12,.010,'sine',.07)}
function finishSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.20,.028,'triangle',i*.08))}

window.addEventListener('resize',fit);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up,{passive:false});window.addEventListener('pointercancel',up,{passive:false});document.addEventListener('pointerdown',resume,{passive:true});el.dropLong.addEventListener('pointerdown',e=>{if(state.selected&&!state.drag){e.preventDefault();chooseHouse('long')}});el.dropShort.addEventListener('pointerdown',e=>{if(state.selected&&!state.drag){e.preventDefault();chooseHouse('short')}});el.again.addEventListener('click',reset);fit();render();
})();
</script>
