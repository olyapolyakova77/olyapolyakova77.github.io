#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(to bottom,rgba(255,255,255,.02),rgba(255,255,255,0) 58%,rgba(255,244,211,.09));
}

/* ambient life */
#ambient{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,244,190,.82);box-shadow:0 0 10px rgba(255,230,130,.8);animation:dustFloat linear infinite}
@keyframes dustFloat{0%{transform:translate(0,18px) scale(.65);opacity:0}15%{opacity:.75}75%{opacity:.45}100%{transform:translate(var(--dx),-120px) scale(1.05);opacity:0}}
.fountain-shimmer{position:absolute;border-radius:50%;filter:blur(15px);opacity:.18;animation:shimmer 3.6s ease-in-out infinite alternate;pointer-events:none}
#shimmerHard{left:180px;top:265px;width:500px;height:250px;background:radial-gradient(ellipse,rgba(86,220,255,.42),rgba(86,220,255,0) 66%)}
#shimmerSoft{left:930px;top:265px;width:500px;height:250px;background:radial-gradient(ellipse,rgba(210,106,255,.42),rgba(210,106,255,0) 66%);animation-delay:-1.7s}
@keyframes shimmer{from{transform:scale(.96);opacity:.12}to{transform:scale(1.025);opacity:.27}}

/* fountain interaction areas */
.target-zone{position:absolute;z-index:8;border-radius:48%;cursor:pointer;pointer-events:auto}
#hardZone{left:125px;top:135px;width:575px;height:460px}
#softZone{left:900px;top:135px;width:575px;height:460px}
.target-zone::before{content:"";position:absolute;inset:60px 40px 55px;border-radius:50%;opacity:0;transition:opacity .28s,transform .28s;transform:scale(.92);pointer-events:none}
#hardZone::before{background:radial-gradient(ellipse,rgba(66,210,255,.2),rgba(66,210,255,0) 68%);box-shadow:0 0 38px rgba(77,222,255,.25)}
#softZone::before{background:radial-gradient(ellipse,rgba(205,91,255,.2),rgba(205,91,255,0) 68%);box-shadow:0 0 38px rgba(205,91,255,.26)}
.target-zone.hot::before,.target-zone:hover::before{opacity:1;transform:scale(1.02)}
.target-zone.wrong::before{animation:wrongAura .52s ease-out 1}
@keyframes wrongAura{0%{opacity:.05;transform:scale(.9)}40%{opacity:.45;transform:scale(1.03)}100%{opacity:0;transform:scale(.94)}}

.target-plaque{
  position:absolute;left:50%;top:305px;transform:translateX(-50%);width:240px;height:92px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#182235;font-weight:900;text-align:center;line-height:1.02;font-size:31px;letter-spacing:.2px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.88),rgba(247,228,187,.9) 52%,rgba(218,182,118,.92));
  border:5px solid #d69f43;
  box-shadow:0 6px 0 #8c5a17,0 11px 16px rgba(79,48,11,.22),inset 0 0 0 4px rgba(255,255,255,.45);
  clip-path:polygon(8% 0,92% 0,100% 18%,100% 82%,92% 100%,8% 100%,0 82%,0 18%);
  pointer-events:none;
}
.target-plaque .phon{font-size:29px}

/* progress gems */
.progress-wrap{position:absolute;z-index:11;pointer-events:none}
.progress-node{position:absolute;width:23px;height:23px;transform:translate(-50%,-50%) rotate(45deg);border-radius:4px;background:linear-gradient(145deg,#6c6b67,#2f3a47);border:3px solid rgba(238,207,132,.78);box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:.64;transition:.45s}
.progress-node::after{content:"";position:absolute;inset:4px;border-radius:2px;background:rgba(245,245,245,.18)}
.progress-node.on{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1.16)}
.progress-wrap.hard .progress-node.on{background:linear-gradient(145deg,#c5f8ff,#36caff 55%,#087bb8);box-shadow:0 0 16px #54dcff,0 0 28px rgba(78,214,255,.8)}
.progress-wrap.soft .progress-node.on{background:linear-gradient(145deg,#f2cfff,#d86bff 55%,#7b30c0);box-shadow:0 0 16px #e080ff,0 0 28px rgba(213,99,255,.75)}

/* helper */
#helper{position:absolute;z-index:16;left:1424px;top:495px;width:168px;height:330px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;transition:transform .26s ease,filter .26s ease}
#helper img{max-width:100%;max-height:100%;display:block;filter:drop-shadow(0 12px 12px rgba(80,55,25,.18));transition:opacity .16s ease,transform .22s ease}
#helper.pop img{animation:helperPop .55s cubic-bezier(.2,.8,.25,1)}
@keyframes helperPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}

/* word medallions */
#tokens{position:absolute;inset:0;z-index:20;pointer-events:none}
.token{position:absolute;width:218px;height:160px;transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;transition:left .56s cubic-bezier(.23,.72,.29,1),top .56s cubic-bezier(.23,.72,.29,1),transform .42s ease,opacity .36s ease,filter .3s ease;touch-action:none;will-change:left,top,transform}
.token.dragging{cursor:grabbing;transition:none;z-index:31;filter:drop-shadow(0 14px 12px rgba(40,34,22,.2))}
.token.processing{z-index:32;pointer-events:none}
.token.selected .medallion{filter:drop-shadow(0 0 12px rgba(255,226,111,.95)) drop-shadow(0 8px 9px rgba(30,20,8,.18));}
.medallion{position:absolute;left:50%;top:50%;width:206px;height:142px;transform:translate(-50%,-50%);animation:floatToken var(--floatDur,4.8s) ease-in-out infinite alternate;pointer-events:none}
@keyframes floatToken{from{translate:-5px 3px}to{translate:7px -7px}}
.sequence-active .token:not(.processing) .medallion{animation-duration:12s}
.medallion::before{
  content:"";position:absolute;left:19px;top:4px;width:168px;height:132px;border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.98) 0 8%,rgba(255,255,255,.32) 9% 18%,transparent 19%),
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.94),rgba(221,243,255,.96) 43%,rgba(109,192,241,.92) 70%,rgba(44,112,174,.95) 100%);
  border:8px solid #e7b44f;
  box-shadow:0 0 0 4px #8b5819,0 0 0 8px rgba(255,231,149,.94),inset 0 -8px 18px rgba(23,78,137,.22),inset 0 7px 14px rgba(255,255,255,.7),0 10px 18px rgba(63,43,18,.2);
}
.token:nth-child(2n) .medallion::before{
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.98) 0 8%,rgba(255,255,255,.3) 9% 18%,transparent 19%),
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.95),rgba(244,228,255,.97) 43%,rgba(207,140,250,.92) 70%,rgba(116,61,172,.95) 100%);
}
.medallion::after{content:"";position:absolute;left:91px;top:-7px;width:28px;height:28px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(145deg,#fbf1b0,#f1b63f 48%,#b46c11);border:4px solid #fff0a5;box-shadow:0 0 0 3px #9c6317,0 3px 9px rgba(81,49,12,.3)}
.word{position:absolute;left:27px;right:27px;top:50%;transform:translateY(-50%);text-align:center;font-size:47px;line-height:1;font-weight:900;color:#121b29;text-shadow:0 2px 0 rgba(255,255,255,.8);white-space:nowrap;z-index:2;pointer-events:none}
.word .c-hi{color:#0a6ea8;text-shadow:0 0 11px rgba(69,210,255,.75),0 2px 0 white}
.token:nth-child(2n) .word .c-hi{color:#7f36b5;text-shadow:0 0 11px rgba(212,103,255,.68),0 2px 0 white}
.token.processing.reading .medallion{animation:none}
.token.processing.reading .word{font-size:51px}

/* controls */
.control{position:absolute;z-index:40;border:0;color:#fff;font-family:inherit;font-weight:900;font-size:29px;letter-spacing:.3px;min-width:180px;height:70px;padding:0 30px;cursor:pointer;text-shadow:0 2px 2px rgba(36,24,7,.35);background:linear-gradient(#4ab85e,#22883c);border:5px solid #e8bf61;box-shadow:0 5px 0 #865211,0 10px 15px rgba(67,39,9,.24),inset 0 0 0 3px rgba(255,255,255,.22);clip-path:polygon(8% 0,92% 0,100% 22%,100% 78%,92% 100%,8% 100%,0 78%,0 22%);transition:transform .15s,filter .2s,opacity .2s}
.control:hover{filter:brightness(1.08)}.control:active{transform:translateY(3px)}
#startBtn,#nextBtn,#finalRestart{left:50%;transform:translateX(-50%)}
#startBtn{top:745px;font-size:34px;min-width:210px;height:76px}
#nextBtn{top:748px;background:linear-gradient(#42a9e8,#236fb8);display:none}
#finalRestart{top:740px;background:linear-gradient(#a673e3,#7440ad);display:none}
.corner-controls{position:absolute;z-index:41;right:28px;top:22px;display:flex;gap:14px}
.corner-controls .control{position:relative;min-width:145px;height:56px;font-size:22px;padding:0 20px;background:linear-gradient(#b68643,#80551d)}
#restartBtn{display:none;background:linear-gradient(#9e72db,#7042a9)}

/* reading focus */
#readingGlow{position:absolute;z-index:14;left:678px;top:345px;width:250px;height:205px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,229,116,.58),rgba(255,216,82,.12) 48%,transparent 72%);filter:blur(8px);transition:opacity .3s;animation:readGlow 1.2s ease-in-out infinite alternate}
#readingGlow.on{opacity:1}@keyframes readGlow{from{transform:scale(.95)}to{transform:scale(1.05)}}

/* feedback effects */
.fx{position:absolute;left:0;top:0;z-index:34;pointer-events:none}
.drop{position:absolute;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(109,220,255,.82) 45%,rgba(38,132,205,.82));box-shadow:0 0 8px rgba(101,215,255,.7);will-change:transform,opacity}
.drop.soft{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(229,155,255,.84) 45%,rgba(146,73,207,.84));box-shadow:0 0 8px rgba(216,121,255,.7)}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffe178;box-shadow:0 0 11px #ffc83c;will-change:transform,opacity}
.ripple{position:absolute;border:4px solid rgba(226,231,255,.84);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:35}
.confetti{position:absolute;width:10px;height:18px;border-radius:3px;will-change:transform,opacity;z-index:50;pointer-events:none}
#lightWave{position:absolute;z-index:15;left:470px;top:350px;width:650px;height:8px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#c7f7ff 18%,#fff1ae 50%,#eccaff 82%,transparent);filter:blur(2px);box-shadow:0 0 18px rgba(255,238,165,.9);transform:scaleX(0);transform-origin:center}
#lightWave.go{animation:waveGo 1.5s ease-in-out 1}@keyframes waveGo{0%{opacity:0;transform:scaleX(0)}35%{opacity:1;transform:scaleX(.72)}70%{opacity:.95;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.05)}}

#wellDone{position:absolute;z-index:45;left:50%;top:290px;transform:translateX(-50%);font-weight:900;font-size:78px;color:#fff6ca;text-shadow:0 4px 0 #8b5d17,0 0 18px #ffd76d,0 0 35px rgba(255,208,79,.85);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .45s,transform .45s}
#wellDone.show{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.03)}
#author{position:absolute;z-index:12;left:20px;bottom:13px;font-size:16px;font-weight:700;color:rgba(50,55,60,.72);text-shadow:0 1px 0 rgba(255,255,255,.9);pointer-events:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){.dust,.medallion,.fountain-shimmer{animation:none!important}}
</style>
</head>

<div id="viewport"><div id="stage" aria-label="Hard C and Soft C sorting game">

  <div id="lightWave"></div>

  <div id="hardProgress" class="progress-wrap hard"></div>
  <div id="softProgress" class="progress-wrap soft"></div>

  <div id="helper"><img id="helperImg" alt="Rabbit helper"></div>
  <div id="tokens"></div>
  <div id="fx" class="fx"></div>

  <button id="startBtn" class="control">Start</button>
  <button id="nextBtn" class="control">Next</button>
  <button id="finalRestart" class="control">Restart</button>
  <div class="corner-controls">

    <button id="restartBtn" class="control">Restart</button>
  </div>
  <div id="author">Created by Полякова Ольга</div>

function resize(){
  const s=Math.min(window.innerWidth/STAGE_W,window.innerHeight/STAGE_H);
  viewport.style.width=(STAGE_W*s)+'px'; viewport.style.height=(STAGE_H*s)+'px';
  stage.style.transform=`scale(${s})`;
}
window.addEventListener('resize',resize); resize();

function delay(ms){return new Promise(resolve=>{const id=setTimeout(()=>{timers.delete(id);resolve()},ms);timers.add(id)})}
function clearTimers(){for(const id of timers)clearTimeout(id);timers.clear()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildRounds(){
  const hard=shuffle(WORDS.filter(w=>w.category==='hard'));
  const soft=shuffle(WORDS.filter(w=>w.category==='soft'));
  let hi=0,si=0; const out=[];
  for(let r=0;r<4;r++){
    const hCount=r%2===0?2:3, sCount=5-hCount;
    let arr=[...hard.slice(hi,hi+hCount),...soft.slice(si,si+sCount)]; hi+=hCount;si+=sCount;
    let tries=0;
    do{arr=shuffle(arr);tries++}while(tries<20 && arr.every((v,i)=>i===0||v.category!==arr[i-1].category));
    out.push(arr);
  }
  return out;
}

function makeDust(){
  const amb=document.getElementById('ambient');
  amb.querySelectorAll('.dust').forEach(n=>n.remove());
  for(let i=0;i<24;i++){
    const d=document.createElement('span'); d.className='dust';
    d.style.left=(60+Math.random()*1480)+'px';d.style.top=(190+Math.random()*600)+'px';
    d.style.setProperty('--dx',(Math.random()*90-45)+'px');d.style.animationDuration=(7+Math.random()*8)+'s';d.style.animationDelay=(-Math.random()*12)+'s';
    d.style.opacity=.2+Math.random()*.55;d.style.transform=`scale(${.55+Math.random()*.85})`;
    amb.appendChild(d);
  }
}

function createProgress(){
  const specs={hard:{el:document.getElementById('hardProgress'),cx:430,cy:535},soft:{el:document.getElementById('softProgress'),cx:1180,cy:535}};
  Object.values(specs).forEach(({el,cx,cy})=>{
    el.innerHTML='';
    for(let i=0;i<10;i++){
      const n=document.createElement('span');n.className='progress-node';n.dataset.index=i;
      const x=cx-150+i*(300/9); const arch=Math.abs(i-4.5)/4.5; const y=cy+12*arch;
      n.style.left=x+'px';n.style.top=y+'px';el.appendChild(n);
    }
  });
}
function updateProgress(cat){
  const el=document.getElementById(cat==='hard'?'hardProgress':'softProgress');
  [...el.children].forEach((n,i)=>n.classList.toggle('on',i<categorySolved[cat]));
}

function setHelper(state,pop=true){
  const src=RABBITS[state]||RABBITS.idle;
  helperImg.style.opacity='0';
  const id=setTimeout(()=>{timers.delete(id);helperImg.src=src;helperImg.style.opacity='1';if(pop){helper.classList.remove('pop');void helper.offsetWidth;helper.classList.add('pop')}},90);timers.add(id);
}

function fontSizeFor(word){return word.length>=6?43:word.length===5?46:49}
function displayWordHTML(word,highlight=false){
  if(!highlight)return word;
  const idx=word.indexOf('c');
  if(idx<0)return word;
  return word.slice(0,idx)+'<span class="c-hi">c</span>'+word.slice(idx+1);
}

function spawnToken(item,slotIndex){
  const t=document.createElement('div');
  t.className='token'; t.dataset.word=item.word;t.dataset.category=item.category;t.dataset.state='idle';t.dataset.slot=slotIndex;t.dataset.id=String(++tokenCounter);
  t.style.left=SLOT_ORIGINS[slotIndex].x+'px';t.style.top=SLOT_ORIGINS[slotIndex].y+'px';t.style.setProperty('--floatDur',(4.2+Math.random()*1.5)+'s');
  t.innerHTML=`<div class="medallion"><div class="word" style="font-size:${fontSizeFor(item.word)}px">${item.word}</div></div>`;
  tokensEl.appendChild(t);activeTokens.set(t.dataset.id,t);bindToken(t);return t;
}
function fillSlot(slotIndex){if(roundQueue.length===0||finalState)return;spawnToken(roundQueue.shift(),slotIndex)}
function loadRound(){
  tokensEl.innerHTML='';activeTokens.clear();selectedToken=null;roundSolved=0;roundQueue=[...rounds[currentRound]];
  nextBtn.style.display='none';wellDone.classList.remove('show');finalRestart.style.display='none';
  setHelper(currentRound===0?'watching':'idle');
  for(let i=0;i<3;i++)fillSlot(i);
}

function stagePoint(ev){const r=viewport.getBoundingClientRect();const s=r.width/STAGE_W;return{x:(ev.clientX-r.left)/s,y:(ev.clientY-r.top)/s}}
function insideZone(x,y,cat){const z=cat==='hard'?{l:125,t:135,r:700,b:595}:{l:900,t:135,r:1475,b:595};return x>=z.l&&x<=z.r&&y>=z.t&&y<=z.b}
function setSelected(t){
  if(sequenceLock||!gameStarted||finalState)return;
  if(selectedToken&&selectedToken!==t){selectedToken.classList.remove('selected');selectedToken.dataset.state='idle'}
  selectedToken=t;t.classList.add('selected');t.dataset.state='selected';playClick();
  (t.dataset.category==='hard'?hardZone:softZone).classList.add('hot');
  const other=t.dataset.category==='hard'?softZone:hardZone;other.classList.remove('hot');
}
function clearSelected(){if(selectedToken){selectedToken.classList.remove('selected');if(selectedToken.dataset.state==='selected')selectedToken.dataset.state='idle'}selectedToken=null;hardZone.classList.remove('hot');softZone.classList.remove('hot')}

function bindToken(t){
  let down=false,drag=false,startP=null,startLeft=0,startTop=0,offsetX=0,offsetY=0,pointerId=null;
  t.addEventListener('pointerdown',ev=>{
    if(sequenceLock||!gameStarted||finalState||!['idle','selected'].includes(t.dataset.state))return;
    ev.preventDefault();pointerId=ev.pointerId;t.setPointerCapture(pointerId);down=true;drag=false;startP=stagePoint(ev);
    startLeft=parseFloat(t.style.left);startTop=parseFloat(t.style.top);offsetX=startP.x-startLeft;offsetY=startP.y-startTop;
    t.classList.add('pressed');
  });
  t.addEventListener('pointermove',ev=>{
    if(!down||ev.pointerId!==pointerId||sequenceLock)return;
    const p=stagePoint(ev),dist=Math.hypot(p.x-startP.x,p.y-startP.y);
    if(!drag&&dist>8){drag=true;t.dataset.state='dragging';t.classList.add('dragging');clearSelected();playClick()}
    if(drag){t.style.left=Math.max(110,Math.min(1490,p.x-offsetX))+'px';t.style.top=Math.max(105,Math.min(800,p.y-offsetY))+'px'}
  });
  t.addEventListener('pointerup',ev=>{
    if(!down||ev.pointerId!==pointerId)return;down=false;t.classList.remove('pressed');
    const p=stagePoint(ev);
    if(drag){t.classList.remove('dragging');const x=parseFloat(t.style.left),y=parseFloat(t.style.top);let target=null;if(insideZone(x,y,'hard'))target='hard';else if(insideZone(x,y,'soft'))target='soft';
      if(target)answer(t,target);else returnToken(t);
    }else setSelected(t);
  });
  t.addEventListener('pointercancel',()=>{down=false;drag=false;t.classList.remove('dragging');returnToken(t)});
}
function returnToken(t){if(!t||!document.body.contains(t))return;const s=Number(t.dataset.slot),o=SLOT_ORIGINS[s];t.dataset.state='idle';t.style.left=o.x+'px';t.style.top=o.y+'px';t.style.transform='translate(-50%,-50%) scale(1)'}

hardZone.addEventListener('pointerdown',()=>{if(selectedToken&&!sequenceLock)answer(selectedToken,'hard')});
softZone.addEventListener('pointerdown',()=>{if(selectedToken&&!sequenceLock)answer(selectedToken,'soft')});

async function answer(t,target){
  if(sequenceLock||!t||!document.body.contains(t)||!['idle','selected','dragging'].includes(t.dataset.state))return;
  clearSelected();
  if(t.dataset.category===target)await correctFlow(t,target);else await wrongFlow(t,target);
}

async function correctFlow(t,target){
  sequenceLock=true;stage.classList.add('sequence-active');t.dataset.state='processing';t.classList.add('processing');
  setHelper('watching');readingGlow.classList.add('on');
  t.style.left=READING_POS.x+'px';t.style.top=READING_POS.y+'px';t.style.transform='translate(-50%,-50%) scale(1.24)';
  await delay(570);
  if(!document.body.contains(t))return;
  t.classList.add('reading');t.querySelector('.word').innerHTML=displayWordHTML(t.dataset.word,true);playReadingPing();
  await delay(1650);
  const zone=target==='hard'?hardZone:softZone;zone.classList.add('hot');
  t.querySelector('.word').innerHTML=t.dataset.word;
  t.classList.remove('reading');readingGlow.classList.remove('on');
  const c=FOUNTAIN_CENTERS[target];t.style.left=c.x+'px';t.style.top=c.y+'px';t.style.transform='translate(-50%,-50%) scale(.72)';
  await delay(610);
  splash(c.x,c.y+45,target);sparkleBurst(c.x,c.y+32,15);playCorrect();
  categorySolved[target]++;totalSolved++;roundSolved++;updateProgress(target);
  const positives=['happy_jump','clap','proud'];setHelper(positives[Math.floor(Math.random()*positives.length)]);
  t.style.opacity='0';t.style.transform='translate(-50%,-50%) scale(.35)';
  const slot=Number(t.dataset.slot);t.dataset.state='completed';activeTokens.delete(t.dataset.id);
  await delay(390);t.remove();zone.classList.remove('hot');stage.classList.remove('sequence-active');
  sequenceLock=false;
  if(totalSolved>=20){await finalFlow();return}
  if(roundSolved>=5){await roundComplete();return}
  fillSlot(slot);
  const id=setTimeout(()=>{timers.delete(id);if(!sequenceLock&&!finalState)setHelper('idle',false)},600);timers.add(id);
}

async function wrongFlow(t,target){
  sequenceLock=true;t.dataset.state='processing';t.classList.add('processing');stage.classList.add('sequence-active');
  const zone=target==='hard'?hardZone:softZone;zone.classList.add('wrong');
  const p=WRONG_RIPPLE[target];wrongRipple(p.x,p.y,target);setHelper('funny');playWrong();
  const slot=Number(t.dataset.slot),o=SLOT_ORIGINS[slot];
  t.animate([
    {transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.92)'},{transform:'translate(-50%,-50%) scale(1.07)'},{transform:'translate(-50%,-50%) scale(1)'}
  ],{duration:520,easing:'ease-out'});
  t.style.left=o.x+'px';t.style.top=o.y+'px';t.style.transform='translate(-50%,-50%) scale(1)';
  await delay(660);t.classList.remove('processing');t.dataset.state='idle';zone.classList.remove('wrong');stage.classList.remove('sequence-active');sequenceLock=false;
  const id=setTimeout(()=>{timers.delete(id);if(!sequenceLock&&!finalState)setHelper('watching',false)},700);timers.add(id);
}

async function roundComplete(){
  setHelper('round_complete');sparkleBurst(800,615,24);pulseBoth();playRound();
  await delay(520);nextBtn.style.display='block';live.textContent=`Round ${currentRound+1} complete`;
}
async function nextRound(){if(sequenceLock||currentRound>=3)return;currentRound++;loadRound();playClick()}

async function finalFlow(){
  finalState=true;sequenceLock=true;stage.classList.add('sequence-active');tokensEl.innerHTML='';activeTokens.clear();readingGlow.classList.remove('on');
  categorySolved.hard=10;categorySolved.soft=10;updateProgress('hard');updateProgress('soft');
  pulseBoth();lightWave.classList.remove('go');void lightWave.offsetWidth;lightWave.classList.add('go');setHelper('final');playFinal();
  sparkleBurst(430,350,30);sparkleBurst(1180,350,30);confettiBurst(92);
  await delay(620);wellDone.classList.add('show');finalRestart.style.display='block';restartBtn.style.display='none';sequenceLock=false;live.textContent='Well done!';
}
function pulseBoth(){hardZone.classList.add('hot');softZone.classList.add('hot');const id=setTimeout(()=>{timers.delete(id);hardZone.classList.remove('hot');softZone.classList.remove('hot')},950);timers.add(id)}

function splash(x,y,target){
  for(let i=0;i<20;i++){
    const d=document.createElement('span');d.className='drop'+(target==='soft'?' soft':'');
    const size=5+Math.random()*10;d.style.width=size+'px';d.style.height=(size*1.35)+'px';d.style.left=(x-size/2)+'px';d.style.top=(y-size/2)+'px';fx.appendChild(d);
    const dx=(Math.random()-.5)*175, up=55+Math.random()*120, down=45+Math.random()*80, rot=(Math.random()-.5)*100;
    const dur=650+Math.random()*470;
    const a=d.animate([{transform:'translate(0,0) rotate(0deg)',opacity:.95},{offset:.48,transform:`translate(${dx*.55}px,${-up}px) rotate(${rot*.5}deg)`,opacity:1},{transform:`translate(${dx}px,${down}px) rotate(${rot}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.18,.66,.35,1)'});
    a.onfinish=()=>d.remove();
  }
}
function wrongRipple(x,y,target){
  for(let i=0;i<3;i++){
    const r=document.createElement('span');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';r.style.width='90px';r.style.height='34px';r.style.borderColor=target==='hard'?'rgba(122,220,255,.8)':'rgba(224,158,255,.82)';fx.appendChild(r);
    const a=r.animate([{transform:'translate(-50%,-50%) scale(.45)',opacity:.8},{transform:'translate(-50%,-50%) scale(1.7)',opacity:0}],{duration:620,delay:i*90,easing:'ease-out'});a.onfinish=()=>r.remove();
  }
}
function sparkleBurst(x,y,count=18){
  for(let i=0;i<count;i++){
    const s=document.createElement('span');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';const z=5+Math.random()*8;s.style.width=z+'px';s.style.height=z+'px';fx.appendChild(s);
    const ang=Math.random()*Math.PI*2,dist=35+Math.random()*100,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
    const a=s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{offset:.25,opacity:1,transform:'translate(-50%,-50%) scale(1.1)'},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.15)`,opacity:0}],{duration:620+Math.random()*520,easing:'ease-out'});a.onfinish=()=>s.remove();
  }
}
function confettiBurst(count=80){
  const cols=['#f4c34d','#70cfff','#b86ee4','#fff0a8','#6de1c0'];
  for(let i=0;i<count;i++){
    const c=document.createElement('span');c.className='confetti';c.style.left=(180+Math.random()*1240)+'px';c.style.top=(-30-Math.random()*220)+'px';c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.width=(7+Math.random()*9)+'px';c.style.height=(10+Math.random()*18)+'px';fx.appendChild(c);
    const dx=(Math.random()-.5)*240,rot=360+Math.random()*900,dur=1800+Math.random()*1800,fall=780+Math.random()*160;
    const a=c.animate([{transform:`translate(0,0) rotate(0deg)`,opacity:1},{transform:`translate(${dx}px,${fall}px) rotate(${rot}deg)`,opacity:.15}],{duration:dur,delay:Math.random()*500,easing:'cubic-bezier(.22,.55,.38,1)'});a.onfinish=()=>c.remove();
  }
}

function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur=.12,type='sine',gain=.035,offset=0){if(!soundOn)return;ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime+offset);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+offset+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+offset+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+offset);o.stop(audioCtx.currentTime+offset+dur+.03)}
function playClick(){tone(520,.07,'sine',.022)}
function playReadingPing(){tone(660,.12,'sine',.025);tone(880,.16,'sine',.018,.09)}
function playCorrect(){tone(660,.16,'sine',.036);tone(880,.2,'sine',.032,.12);tone(1040,.2,'sine',.024,.24)}
function playWrong(){tone(210,.14,'sine',.023);tone(175,.18,'sine',.018,.12)}
function playRound(){tone(523,.18,'triangle',.028);tone(659,.18,'triangle',.028,.12);tone(784,.24,'triangle',.027,.24)}
function playFinal(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.032,i*.14))}

function resetGame(autoStart=false){
  clearTimers();sequenceLock=false;selectedToken=null;finalState=false;currentRound=0;roundSolved=0;totalSolved=0;categorySolved={hard:0,soft:0};
  rounds=buildRounds();roundQueue=[];tokensEl.innerHTML='';activeTokens.clear();fx.innerHTML='';wellDone.classList.remove('show');lightWave.classList.remove('go');readingGlow.classList.remove('on');
  hardZone.classList.remove('hot','wrong');softZone.classList.remove('hot','wrong');nextBtn.style.display='none';finalRestart.style.display='none';
  updateProgress('hard');updateProgress('soft');setHelper('idle',false);
  if(autoStart){gameStarted=true;startBtn.style.display='none';restartBtn.style.display='block';loadRound()}else{gameStarted=false;startBtn.style.display='block';restartBtn.style.display='none'}
}
function startGame(){if(gameStarted)return;ensureAudio();gameStarted=true;startBtn.style.display='none';restartBtn.style.display='block';rounds=buildRounds();currentRound=0;categorySolved={hard:0,soft:0};totalSolved=0;loadRound();playRound()}

startBtn.addEventListener('click',startGame);nextBtn.addEventListener('click',nextRound);restartBtn.addEventListener('click',()=>{playClick();resetGame(true)});finalRestart.addEventListener('click',()=>{playClick();resetGame(true)});
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound':'Sound off';if(soundOn){ensureAudio();playClick()}});

makeDust();createProgress();setHelper('idle',false);resetGame(false);
window.__WF={getState:()=>({gameStarted,currentRound,roundSolved,totalSolved,categorySolved:{...categorySolved},active:[...activeTokens.values()].map(t=>({id:t.dataset.id,word:t.dataset.word,category:t.dataset.category,state:t.dataset.state,slot:+t.dataset.slot}))}),reset:()=>resetGame(true)};
})();
</script>
