<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Полякова Ольга — Games Library</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #202b3c; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    h1 { margin: 0 0 40px; font-size: clamp(1.6rem, 4vw, 2rem); line-height: 1.3; }
    h2 { margin: 0 0 16px; font-size: 1.125rem; }
    article { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 24px; background: #fff; border: 1px solid #dce2ea; border-radius: 12px; }
    h3 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 18px; border: 1px solid #b7c2d1; border-radius: 7px; background: #fff; color: #243b59; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .primary { background: #2458ad; border-color: #2458ad; color: #fff; }
    .button:hover { background: #edf2f8; }
    .primary:hover { background: #1b468d; }
    .button:focus-visible, input:focus-visible { outline: 3px solid #5689d7; outline-offset: 3px; }
    #status { margin: 12px 0 0; min-height: 1.6em; font-size: .875rem; color: #435570; }
    #manual-copy { margin-top: 12px; }
    label { display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #b7c2d1; border-radius: 6px; font: inherit; }
    @media (max-width: 480px) { main { padding: 32px 16px; } article { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>Полякова Ольга — Games Library</h1>
    <section aria-labelledby="grammar-heading">
      <h2 id="grammar-heading" lang="en">Grammar</h2>
      <article>
        <h3 lang="en">Past Simple Lab</h3>
        <div class="actions">
          <a class="button primary" href="./grammar/past-simple-lab/" lang="en">Open game</a>
          <button class="button" id="copy-link" type="button" lang="en">Copy link</button>
        </div>
      </article>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="manual-copy" hidden>
        <label for="game-link">Скопируйте ссылку вручную:</label>
        <input id="game-link" type="url" readonly value="https://olyapolyakova77.github.io/grammar/past-simple-lab/">
      </div>
    </section>
  </main>
  <script>
    const gameLink = document.getElementById('game-link');
    const status = document.getElementById('status');
    const manualCopy = document.getElementById('manual-copy');
    document.getElementById('copy-link').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(gameLink.value);
        manualCopy.hidden = true;
        status.textContent = 'Ссылка скопирована.';
      } catch {
        status.textContent = 'Не удалось скопировать автоматически.';
        manualCopy.hidden = false;
        gameLink.focus();
        gameLink.select();
      }
    });
  </script>
</body>
</html>
